name: Report a textbook question
description: Submit a correction for a ClearExams question. A GitHub account is needed.
title: "[Textbook question] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Please do not include names, phone numbers, police case details, or other personal information. Include the question ID and textbook evidence where possible."
  - type: input
    id: question_id
    attributes:
      label: Question ID
      placeholder: C10SCI-U01-Q0001
    validations:
      required: true
  - type: input
    id: question_location
    attributes:
      label: Class, subject, unit and quiz
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: Problem type
      options:
        - Incorrect answer
        - Incorrect English or Tamil translation
        - Bad options or ambiguity
        - Wrong source page or broken book link
        - Repeated or irrelevant question
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Explain the issue and suggested correction
      description: Provide a textbook page, URL or other factual reference if relevant.
    validations:
      required: true
