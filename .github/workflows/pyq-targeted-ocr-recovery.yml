name: Recover missing TNPSC PYQ source text

on:
  push:
    branches: [main]
    paths:
      - scripts/pyq_targeted_ocr_recovery.py
      - .github/workflows/pyq-targeted-ocr-recovery.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  ocr:
    name: Recover blank paper pages without inventing MCQs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF and Tamil-English image-text extraction
        run: |
          python -m pip install --quiet pymupdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng tesseract-ocr-tam
      - name: Guard original paper identifiers and disable answer scoring
        run: python tests/test_pyq_targeted_ocr_recovery.py
      - name: Extract only paper pages with known missing or damaged text
        env:
          OMP_THREAD_LIMIT: "1"
        run: |
          python scripts/pyq_targeted_ocr_recovery.py --timeout 55
      - name: Upload explicit unresolved-page status and source-labeled OCR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clearexams-tnpsc-targeted-pyq-ocr-drafts
          path: data/quizzes/pyq-reader-drafts/ocr-recovery/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Publish only source-attributed ungraded OCR text
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/quizzes/pyq-reader-drafts/ocr-recovery/*.json
          if git diff --cached --quiet; then
            echo "No OCR draft changes"
          else
            git commit -m 'Stage focused ungraded TNPSC OCR source-page recovery [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            gh workflow run jekyll-gh-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
