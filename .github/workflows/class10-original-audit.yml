name: Audit original Class 10 English and Tamil Science Social Science
on:
  pull_request:
    paths:
      - scripts/audit_class10_originals.py
      - .github/workflows/class10-original-audit.yml
  workflow_dispatch:
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python -m pip install pymupdf
      - name: Scan original Class 10 English Tamil four books
        run: python scripts/audit_class10_originals.py
      - name: Preserve source fingerprints and firsts candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class10-original-four-books-source-evidence
          path: data/textbook/class10-full-year-original-audit-2026-11-02.json
          if-no-files-found: warn
