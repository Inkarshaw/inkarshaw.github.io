# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Generate current affairs PDF list
        run: python3 current-affairs/generate-pdf-list.py
      - name: Test current affairs text input validation
        run: python3 -m unittest discover -s tests -p 'test_current_affairs_text.py'
      - name: Test ClearExams quizzes, text links and syllabus regressions
        run: python3 -m unittest discover -s tests -p 'test_clear_exams_regressions.py'
      - name: Test commercial readiness and content freshness labels
        run: python3 -m unittest discover -s tests -p 'test_commercial_readiness.py'
      - name: Verify Class 11 History catalogue counts
        run: node tests/test_class11_catalogue.mjs
      - name: Build vetted current affairs text pages and archive
        run: python3 current-affairs/text/build_text_editions.py
      - name: Check text edition catalog
        run: python3 -m json.tool current-affairs/text/editions.json > /dev/null
      - name: Verify latest edition and complete static archive
        run: python3 -m unittest discover -s tests -p 'test_current_affairs_archive.py' -v
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Copy current affairs PDFs into Pages artifact
        run: |
          mkdir -p _site/current-affairs
          find current-affairs -maxdepth 1 -type f -name '*.pdf' -exec cp -f {} _site/current-affairs/ \;
          test -f _site/current-affairs/2026-09-21.pdf
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
