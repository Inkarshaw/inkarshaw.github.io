name: ClearExams mobile browser smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "tnpsc-group1-syllabus.html"
      - "tnpsc-group1-topic-practice.html"
      - "assets/css/clear-pathways.css"
      - "assets/js/tnpsc-group1-syllabus.js"
      - "assets/js/tnpsc-group1-topic-practice.js"
      - "data/tnpsc/group1-prelims-topics.json"
      - "tests/test_group1_syllabus_flow.mjs"
      - "tnpsc.html"
      - "start.html"
      - "practice.html"
      - "daily-quiz.html"
      - "textbook-quiz.html"
      - "textbook-fathers.html"
      - "data/special-quizzes/fathers.json"
      - "tests/test_fathers_book_sources.py"
      - "ncert-school-book-quiz.html"
      - "dashboard.html"
      - "pyq-hub.html"
      - "assets/pyq-original/tnpsc-g1-2026-q*-editorial.svg"
      - "tnusrb-si-2010-quiz.html"
      - "tnusrb-si-2020-quiz.html"
      - "tnusrb-si-2015-quiz.html"
      - "tnpsc-g1-2026-quiz.html"
      - "assets/js/tnpsc-g1-2026-quiz.js"
      - "data/quizzes/tnpsc-group-i-2026-prelims-text.json"
      - "tests/test_tnpsc_g1_2026_quiz.mjs"
      - "assets/js/tnusrb-si-2015-quiz.js"
      - "data/quizzes/tnusrb-si-2015-open.json"
      - "tests/test_tnusrb_si_2015_quiz.mjs"
      - "assets/js/tnusrb-si-2020-quiz.js"
      - "data/quizzes/tnusrb-si-2020-series-c.json"
      - "tests/test_tnusrb_si_2020_quiz.mjs"
      - "assets/js/tnusrb-si-2010-quiz.js"
      - "data/quizzes/tnusrb-si-2010-open-type-a.json"
      - "tests/test_tnusrb_si_2010_quiz.mjs"
      - "pyq-full-quiz.html"
      - "assets/js/pyq-full-quiz.js"
      - "assets/css/mobile-navigation.css"
      - "tests/smoke_student_journey.mjs"
      - ".github/workflows/mobile-browser-smoke.yml"

permissions:
  contents: read

jobs:
  chromium-student-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the static site locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/clearexams-browser-server.log 2>&1 &
          echo $! > /tmp/clearexams-browser-server.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/clearexams-browser-server.log
          exit 1
      - name: Exercise student journeys in mobile Chromium
        run: node tests/smoke_student_journey.mjs
