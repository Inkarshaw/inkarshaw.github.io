name: Build Class 12 Geography Unit 1

on:
  push:
    paths:
      - '.tmp/geography12/unit1/builder.b64.*'
      - '.github/workflows/build-class12-geography-unit1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unit-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and publish Geography Unit 1
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/geography12/unit1/builder.b64.1 .tmp/geography12/unit1/builder.b64.2 .tmp/geography12/unit1/builder.b64.3 .tmp/geography12/unit1/builder.b64.4 > /tmp/builder.b64
          python - <<'PY'
          import base64, pathlib, zlib
          raw = base64.b64decode(pathlib.Path('/tmp/builder.b64').read_text().strip())
          pathlib.Path('/tmp/build_geo12_u1.py').write_bytes(zlib.decompress(raw))
          PY
          python /tmp/build_geo12_u1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/textbook/class-12/geography/unit-1.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Class 12 Geography Unit 1 bilingual competitive question bank"
          git push
