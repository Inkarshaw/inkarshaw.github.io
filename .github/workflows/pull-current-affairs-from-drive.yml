name: Pull current affairs PDF from Google Drive

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date in YYYY-MM-DD (defaults to current IST date)"
        required: false
        type: string
  schedule:
    - cron: "45 14 * * *"  # 20:15 IST

permissions:
  contents: write

jobs:
  pull-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve date
        id: d
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE=$(TZ=Asia/Kolkata date +%F)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Download public PDF from Google Drive
        shell: bash
        run: |
          DATE="${{ steps.d.outputs.date }}"
          FILE_ID="1BVklPd77i1fb_dIQUjKe7N6QE2jYUIcd"
          OUT="current-affairs/$DATE.pdf"
          mkdir -p current-affairs
          curl --fail --location --retry 3 \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            --output "$OUT"
          test -s "$OUT"
          if ! head -c 5 "$OUT" | grep -q '%PDF-'; then
            echo "Downloaded file is not a PDF. Check Drive sharing (Anyone with the link -> Viewer)."
            rm -f "$OUT"
            exit 1
          fi
          echo "Downloaded $OUT ($(du -h "$OUT" | cut -f1))"

      - name: Rebuild current affairs PDF list
        run: python3 current-affairs/generate-pdf-list.py

      - name: Commit PDF and updated list
        shell: bash
        run: |
          DATE="${{ steps.d.outputs.date }}"
          FILE="current-affairs/$DATE.pdf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE" current-affairs/pdfs.json
          if git diff --cached --quiet; then
            echo "PDF and list are already up to date."
            exit 0
          fi
          git commit -m "Publish current affairs PDF and update list for $DATE"
          git push
