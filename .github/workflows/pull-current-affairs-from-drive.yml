name: Pull current affairs PDF from Google Drive

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date in YYYY-MM-DD (defaults to current IST date)"
        required: false
        type: string
  push:
    branches: ["main"]
    paths:
      - "current-affairs/publish-date.txt"

permissions:
  contents: write

concurrency:
  group: current-affairs-drive-publish
  cancel-in-progress: false

jobs:
  pull-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve date
        id: d
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            DATE=$(tr -d '[:space:]' < current-affairs/publish-date.txt)
          elif [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE=$(TZ=Asia/Kolkata date +%F)
          fi
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid publish date: $DATE"
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Download public PDF from Google Drive
        shell: bash
        run: |
          DATE="${{ steps.d.outputs.date }}"
          FILE_ID="1BVklPd77i1fb_dIQUjKe7N6QE2jYUIcd"
          OUT="current-affairs/$DATE.pdf"
          mkdir -p current-affairs
          curl --fail --location --retry 3 \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            --output "$OUT"
          test -s "$OUT"
          head -c 5 "$OUT" | grep -q '%PDF-'
          echo "Downloaded $OUT ($(du -h "$OUT" | cut -f1))"

      - name: Rebuild current affairs PDF list
        run: python3 current-affairs/generate-pdf-list.py

      - name: Commit PDF and updated list
        shell: bash
        run: |
          DATE="${{ steps.d.outputs.date }}"
          FILE="current-affairs/$DATE.pdf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE" current-affairs/pdfs.json
          if git diff --cached --quiet; then
            echo "PDF and list are already up to date."
            exit 0
          fi
          git commit -m "Publish current affairs PDF and update list for $DATE"
          git pull --rebase origin main
          git push origin main
