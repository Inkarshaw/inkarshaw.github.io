name: ClearExams bulk paper typing drafts

on:
  push:
    branches:
      - pyq-fast-typed-first-bulk-20261118
    paths:
      - scripts/pyq_bulk_pdf_to_drafts.py
      - .github/workflows/pyq-bulk-typing.yml
  workflow_dispatch:
    inputs:
      ocr:
        description: OCR all image-only Tamil and English PDF pages
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  extract:
    name: Convert all linked exam PDFs in one batch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF and Tamil OCR dependencies
        run: |
          python -m pip install --quiet pymupdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-tam tesseract-ocr-eng
      - name: Test source enumeration and parser
        run: python tests/test_pyq_bulk_pdf_to_drafts.py
      - name: Type all paper PDFs without inferred answers
        env:
          OCR_INPUT: ${{ github.event.inputs.ocr || 'false' }}
        shell: bash
        run: |
          FLAGS=""
          if [ "$OCR_INPUT" = "true" ]; then FLAGS="--ocr"; fi
          python scripts/pyq_bulk_pdf_to_drafts.py --workers 4 --timeout 40 $FLAGS
      - name: Upload draft text and unresolved source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clear-exams-all-papers-text-drafts
          path: data/quizzes/pyq-bulk-drafts/*.json
          retention-days: 30
          if-no-files-found: warn
