name: ClearExams bulk paper typing drafts

on:
  push:
    branches:
      - main
      - pyq-fast-typed-first-bulk-20261118
    paths:
      - scripts/pyq_bulk_pdf_to_drafts.py
      - data/quizzes/pyq-yearwise-catalog.json
      - .github/workflows/pyq-bulk-typing.yml
      - scripts/build_pyq_fast_reader_drafts.py
      - tests/test_pyq_fast_reader_drafts.py
  workflow_dispatch:
    inputs:
      ocr:
        description: OCR all image-only Tamil and English PDF pages
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  fast-text:
    if: github.event_name == 'workflow_dispatch'
    name: Extract and publish readable PDF text drafts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fast PDF text extractor
        run: python -m pip install --quiet pymupdf
      - name: Validate all source links
        run: python tests/test_pyq_bulk_pdf_to_drafts.py
      - name: Read all PDF text layers without slow OCR
        run: |
          python scripts/pyq_bulk_pdf_to_drafts.py --workers 5 --timeout 40 --output data/quizzes/pyq-fast-drafts
      - name: Package only readable pages for typewritten draft reader
        run: |
          python tests/test_pyq_fast_reader_drafts.py
          python scripts/build_pyq_fast_reader_drafts.py --input data/quizzes/pyq-fast-drafts --output data/quizzes/pyq-reader-drafts
      - name: Publish source-labelled ungraded page drafts on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/quizzes/pyq-reader-drafts/
          if git diff --cached --quiet; then
            echo 'No new readable page-text drafts'
          else
            git commit -m 'Update ungraded PYQ machine-readable page drafts [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"ref":"main"}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/jekyll-gh-pages.yml/dispatches"
          fi
      - name: Upload immediate machine-text drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clear-exams-fast-pdf-text-drafts
          path: data/quizzes/pyq-fast-drafts/*.json
          retention-days: 30
          if-no-files-found: warn

  extract:
    if: github.event_name == 'workflow_dispatch' && inputs.ocr == true
    name: Convert all linked exam PDFs in one batch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF and Tamil OCR dependencies
        run: |
          python -m pip install --quiet pymupdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-tam tesseract-ocr-eng
      - name: Test source enumeration and parser
        run: python tests/test_pyq_bulk_pdf_to_drafts.py
      - name: Type all paper PDFs without inferred answers
        env:
          OCR_INPUT: ${{ github.event.inputs.ocr || 'true' }}
        shell: bash
        run: |
          FLAGS=""
          if [ "$OCR_INPUT" = "true" ]; then FLAGS="--ocr"; fi
          python scripts/pyq_bulk_pdf_to_drafts.py --workers 4 --timeout 40 $FLAGS
      - name: Upload draft text and unresolved source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clear-exams-all-papers-text-drafts
          path: data/quizzes/pyq-bulk-drafts/*.json
          retention-days: 30
          if-no-files-found: warn
