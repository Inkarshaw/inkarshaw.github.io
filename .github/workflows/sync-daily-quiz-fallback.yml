name: Sync daily quiz fallback

on:
  workflow_dispatch:
  schedule:
    - cron: "27 */6 * * *"

permissions:
  contents: write

concurrency:
  group: daily-quiz-fallback-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download public Daily Quiz Feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/quizzes
          tmp="$(mktemp)"
          curl --fail --location --retry 3 \
            --connect-timeout 15 --max-time 60 \
            "https://docs.google.com/spreadsheets/d/1yhND5g2Q23eOXz3oakV7xX-pUuunw3i2GzES3yaFVVY/gviz/tq?tqx=out:csv&sheet=Daily%20Quiz%20Feed" \
            --output "$tmp"

          test -s "$tmp"
          python3 - "$tmp" <<'PY'
          import csv, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              if not reader.fieldnames:
                  raise SystemExit("Daily Quiz Feed has no header row")
              normalized = {h.strip(): h for h in reader.fieldnames}
              required = ["Active","Exam","Topic","Subtopic","Question","OptionA","OptionB","OptionC","OptionD","CorrectAnswer","ExplanationA","ExplanationB","ExplanationC","ExplanationD"]
              missing = [h for h in required if h not in normalized]
              if missing:
                  raise SystemExit("Daily Quiz Feed is missing columns: " + ", ".join(missing))
              from collections import Counter
              valid = 0
              coverage = Counter()
              for raw in reader:
                  row = {k.strip(): (v or "").strip() for k, v in raw.items() if k is not None}
                  if row.get("Active","").lower() == "false":
                      continue
                  if not row.get("Question") or not row.get("Exam") or not row.get("Topic") or not row.get("Subtopic"):
                      continue
                  if row.get("CorrectAnswer","").upper() not in {"A","B","C","D"}:
                      continue
                  if not all(row.get("Option"+x) and row.get("Explanation"+x) for x in "ABCD"):
                      continue
                  valid += 1
                  coverage[row["Exam"]] += 1
              required_coverage = {
                  "TNPSC Group IV": 10,
                  "TNUSRB": 10,
                  "UPSC": 10,
                  "SSC": 10,
                  "Banking": 10,
                  "Railways": 10,
              }
              missing = [f"{exam}: {coverage.get(exam,0)}/{minimum}" for exam, minimum in required_coverage.items() if coverage.get(exam,0) < minimum]
              if missing:
                  raise SystemExit("Daily Quiz Feed lacks required multi-exam coverage; refusing to overwrite fallback: " + ", ".join(missing))
              print(valid)
          PY

          mv "$tmp" data/quizzes/daily-quiz.csv
          rows=$(($(wc -l < data/quizzes/daily-quiz.csv)-1))
          echo "Daily quiz fallback synchronized with $rows source rows after validation." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit fallback when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/quizzes/daily-quiz.csv; then
            echo "Fallback is already synchronized." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quizzes/daily-quiz.csv
          git commit -m "Sync daily quiz fallback from Google Sheets"
          git pull --rebase origin main
          git push origin main
