name: Audit original Class 6 Term I English Tamil books
on:
  pull_request:
    paths:
      - scripts/audit_class6_term1_originals.py
      - .github/workflows/class6-term1-original-audit.yml
  workflow_dispatch:
jobs:
  original-books:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text reader
        run: python -m pip install pymupdf
      - name: Scan entire source PDFs and 2025 bilingual transcripts
        run: python scripts/audit_class6_term1_originals.py
      - name: Preserve page-by-page evidence JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class6-term1-original-audit-evidence
          path: data/textbook/class6-term1-original-audit-2026-11-01.json
          if-no-files-found: warn
