name: ClearExams site health

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: clearexams-site-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate repository health
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < CNAME)" = "clearexams.ink"
          python3 -m json.tool current-affairs/pdfs.json >/dev/null
          python3 - <<'PY'
          import csv, json, pathlib, re, urllib.parse, xml.etree.ElementTree as ET
          tree = ET.parse("sitemap.xml")
          root = tree.getroot()
          if len(root) < 10:
              raise SystemExit("sitemap.xml contains too few URLs")
          urls = [x.text for x in root.iter() if x.tag.endswith('loc') and x.text]
          required_urls = {
              'https://clearexams.ink/',
              'https://clearexams.ink/start.html',
              'https://clearexams.ink/daily-quiz.html',
              'https://clearexams.ink/pyq-hub.html',
              'https://clearexams.ink/dashboard.html',
              'https://clearexams.ink/syllabus.html',
              'https://clearexams.ink/tnpsc.html',
              'https://clearexams.ink/tnusrb.html',
              'https://clearexams.ink/upsc.html',
          }
          missing = sorted(required_urls - set(urls))
          if missing:
              raise SystemExit('Required sitemap URLs missing: ' + ', '.join(missing))
          p = pathlib.Path("data/quizzes/daily-quiz.csv")
          with p.open(encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))
          if len(rows) < 10:
              raise SystemExit("daily-quiz.csv has fewer than 10 question rows")
          required = {"ID","Question","OptionA","OptionB","OptionC","OptionD","CorrectAnswer"}
          if not rows or not required.issubset(rows[0].keys()):
              raise SystemExit("daily-quiz.csv is missing required columns")

          routes = json.loads(pathlib.Path("data/exams/exam-routes.json").read_text(encoding="utf-8"))
          catalog = json.loads(pathlib.Path("data/exams/exam-catalog.json").read_text(encoding="utf-8"))
          catalog_ids = {item["id"] for body in catalog.values() for item in body.get("items", [])}
          syllabus_text = pathlib.Path("syllabus.html").read_text(encoding="utf-8")
          syllabus_ids = set(re.findall(r"""\bid\s*:\s*['"]([^'"]+)['"]""", syllabus_text))

          if set(routes) - set(catalog):
              raise SystemExit("exam-routes.json contains unknown exam families: " + ", ".join(sorted(set(routes) - set(catalog))))

          route_fields = ("hubRoute","syllabusRoute","pyqRoute","preparationRoute","currentAffairsRoute")
          for family, route in routes.items():
              for field in route_fields:
                  value = route.get(field)
                  if not value:
                      raise SystemExit(f"{family}.{field} is missing")
                  parsed = urllib.parse.urlsplit(value)
                  path = pathlib.Path(urllib.parse.unquote(parsed.path))
                  candidates = [path]
                  if str(path).endswith("/") or not path.suffix:
                      candidates += [path / "index.html", path.with_suffix(".html")]
                  if not any(candidate.exists() for candidate in candidates):
                      raise SystemExit(f"{family}.{field} points to missing path: {value}")
              prep = urllib.parse.urlsplit(route["preparationRoute"])
              prep_exam = urllib.parse.parse_qs(prep.query).get("exam", [""])[0]
              if prep_exam not in catalog_ids:
                  raise SystemExit(f"{family}.preparationRoute uses unknown exam id: {prep_exam}")
              syllabus = urllib.parse.urlsplit(route["syllabusRoute"])
              if syllabus.fragment and syllabus.fragment not in syllabus_ids:
                  raise SystemExit(f"{family}.syllabusRoute uses unknown syllabus fragment: {syllabus.fragment}")
          PY
          echo "Repository metadata checks passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate core exam-site internal links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          root = Path('.').resolve()
          skip_dirs = {'.git','node_modules','vendor','website-automation','instagram-publisher','policedocuments','cdranalysis','exam'}
          download_ext = {'.pdf','.doc','.docx','.xls','.xlsx','.ppt','.pptx','.zip','.rar'}
          broken=[]; checked=0

          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag not in {'a','link','script','img','source'}: return
                  d=dict(attrs); value=d.get('href') or d.get('src')
                  if value: self.hrefs.append(value)

          files=[p for p in root.rglob('*.html') if not any(part in skip_dirs for part in p.relative_to(root).parts)]
          for p in files:
              try: text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              parser=Links(); parser.feed(text)
              for raw in parser.hrefs:
                  raw=raw.strip()
                  if not raw or raw.startswith(('#','mailto:','tel:','javascript:','data:','blob:')): continue
                  u=urlsplit(raw)
                  if u.scheme in {'http','https'} or raw.startswith('//'): continue
                  path=unquote(u.path)
                  if not path or Path(path).suffix.lower() in download_ext: continue
                  target=(root/path.lstrip('/')) if path.startswith('/') else (p.parent/path)
                  candidates=[target]
                  if path.endswith('/') or not target.suffix:
                      candidates.extend([target/'index.html',target.with_suffix('.html')])
                  checked+=1
                  if not any(x.resolve().exists() for x in candidates): broken.append(f'{p.relative_to(root)} -> {raw}')
          print(f'Checked {checked} core exam-site links across {len(files)} HTML files.')
          if broken:
              print('Broken core exam-site links:')
              print('\n'.join(' - '+x for x in broken[:100]))
              if len(broken)>100: print(f' ... and {len(broken)-100} more')
              raise SystemExit(1)
          PY
          echo "Core exam-site internal links passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Audit legacy and download links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          root=Path('.').resolve(); areas={'policedocuments','cdranalysis','exam'}; missing=[]; checked=0
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.hrefs=[]
              def handle_starttag(self,tag,attrs):
                  if tag not in {'a','link','script','img','source'}: return
                  d=dict(attrs); v=d.get('href') or d.get('src')
                  if v:self.hrefs.append(v)
          for area in areas:
              base=root/area
              if not base.exists(): continue
              for p in base.rglob('*.html'):
                  try:text=p.read_text(encoding='utf-8')
                  except UnicodeDecodeError:continue
                  parser=Links();parser.feed(text)
                  for raw in parser.hrefs:
                      raw=raw.strip();u=urlsplit(raw)
                      if not raw or raw.startswith(('#','mailto:','tel:','javascript:','data:','blob:','//')) or u.scheme in {'http','https'}:continue
                      path=unquote(u.path)
                      if not path:continue
                      target=(root/path.lstrip('/')) if path.startswith('/') else (p.parent/path)
                      candidates=[target]
                      if path.endswith('/') or not target.suffix:candidates.extend([target/'index.html',target.with_suffix('.html')])
                      checked+=1
                      if not any(x.resolve().exists() for x in candidates):missing.append(f'{p.relative_to(root)} -> {raw}')
          print(f'Audited {checked} legacy/download-area links; {len(missing)} unresolved.')
          summary=Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a',encoding='utf-8') as f:
              f.write('## Legacy/download link audit\n')
              f.write(f'- Unresolved links: {len(missing)}\n')
              for x in missing[:25]: f.write(f'  - {x}\n')
              if len(missing)>25:f.write(f'  - … and {len(missing)-25} more\n')
          PY

      - name: Check production pages
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://clearexams.ink/"
            "https://clearexams.ink/start.html"
            "https://clearexams.ink/current-affairs/"
            "https://clearexams.ink/daily-quiz.html"
            "https://clearexams.ink/exam-notifications.html"
            "https://clearexams.ink/exam-calendar.html"
            "https://clearexams.ink/pyq-hub.html"
            "https://clearexams.ink/dashboard.html"
            "https://clearexams.ink/search.html"
            "https://clearexams.ink/study-plan-30.html"
            "https://clearexams.ink/answer-writing.html"
            "https://clearexams.ink/current-affairs/compilations.html"
            "https://clearexams.ink/current-affairs/daily.html"
            "https://clearexams.ink/exam-preparation.html"
            "https://clearexams.ink/syllabus.html"
            "https://clearexams.ink/tnpsc.html"
            "https://clearexams.ink/tnusrb.html"
            "https://clearexams.ink/upsc.html"
            "https://clearexams.ink/policedocuments/"
            "https://clearexams.ink/sitemap.xml"
            "https://clearexams.ink/robots.txt"
          )
          echo "## ClearExams production checks" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for url in "${urls[@]}"; do
            code="000"
            for attempt in 1 2 3 4 5 6; do
              code=$(curl --location --silent --show-error --connect-timeout 15 --max-time 45 --output /dev/null --write-out "%{http_code}" "$url" || true)
              if [[ "$code" =~ ^[23] ]]; then break; fi
              if [ "$attempt" -lt 6 ]; then sleep 10; fi
            done
            if [[ "$code" =~ ^[23] ]]; then
              echo "- ✅ $url — HTTP $code" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $url — HTTP $code" >> "$GITHUB_STEP_SUMMARY"; failed=1
            fi
          done
          exit "$failed"

      - name: Enforce current domain
        shell: bash
        run: |
          set -euo pipefail
          echo "## Legacy-domain scan" >> "$GITHUB_STEP_SUMMARY"
          matches=$(grep -RIl --exclude-dir=.git --exclude-dir=.github --exclude-dir=website-automation --exclude-dir=instagram-publisher --exclude='*.pdf' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.webp' "clearexams.online" . || true)
          if [ -z "$matches" ]; then
            echo "- ✅ No clearexams.online references found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ Old-domain references remain in:" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r file; do echo "  - ${file#./}" >> "$GITHUB_STEP_SUMMARY"; done <<< "$matches"
            exit 1
          fi
