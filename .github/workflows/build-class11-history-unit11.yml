name: Build Class 11 History Unit 11

on:
  push:
    paths:
      - '.github/workflows/build-class11-history-unit11.yml'

permissions:
  contents: write

jobs:
  build-unit-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and publish Unit 11 question bank
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/unit11/chunk*.txt | base64 -d | gzip -d > /tmp/build_unit11.py
          python /tmp/build_unit11.py
          mkdir -p data/textbook/class-11/history
          cp /mnt/data/unit-11.json data/textbook/class-11/history/unit-11.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/textbook/class-11/history/unit-11.json
          git commit -m "Add Class 11 History Unit 11 bilingual competitive question bank (1404 questions)"
          git push
