name: CDS II 2020 source acquisition probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/cds_2020_source_probe.py
      - .github/workflows/cds-2020-source-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4
      - run: python scripts/cds_2020_source_probe.py
