name: ClearExams PR quiz and text quality

on:
  pull_request:
    branches: [main]
    paths:
      - "daily-quiz.html"
      - "pyq-hub.html"
      - "data/quizzes/pyq-yearwise-catalog.json"
      - "data/quizzes/verified-pyqs.json"
      - "textbook-*.html"
      - "ncert-school-book-quiz.html"
      - "assets/js/ncert-school-book-quiz.js"
      - "data/ncert/**"
      - "index.html"
      - "dashboard.html"
      - "search.html"
      - "assets/js/textbook-*.js"
      - "assets/js/syllabus-reader.js"
      - "data/textbook/**"
      - "current-affairs/text/**"
      - "tests/**"
      - "scripts/audit_textbook_quiz_quality.py"
      - "scripts/audit_textbook_repository.py"
      - ".github/workflows/pr-quiz-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Quizzes, navigation, and text edition checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Group IIA syllabus and linked Tamil Nadu textbook notes
        run: node tests/test_group2a_text_notes.mjs
      - name: Run ClearExams regression tests
        run: python3 -m unittest discover -s tests -p "test_clear_exams_regressions.py" -v
      - name: Regression checks for generated archive links and shared daily-quiz banks
        run: python3 -m unittest discover -s tests -p "test_workflow_repairs.py" -v

      - name: Validate Police Documents LTE and 5G cell identifiers
        run: python3 -m unittest discover -s tests -p "test_police_cell_tower_locator.py" -v
      - name: Test NCERT School Book Quiz bank and player
        run: node tests/test_ncert_school_book_quiz.mjs
      - name: Validate attributed previous-year questions and Daily Quiz loading
        run: node tests/test_daily_quiz_pyq.mjs
      - name: Validate year-wise paper catalog and PYQ year routing
        run: node tests/test_pyq_yearwise.mjs
      - name: Review TNPSC Group IV 2022 source-numbered PYQ bank
        run: node tests/test_tnpsc_g4_2022_pyqs.mjs
      - name: Reconcile TNPSC 2018 and 2019 PYQs to final key and filter by year
        run: node tests/test_tnpsc_g4_2018_2019_pyqs.mjs
      - name: Verify TNPSC Group II and IIA 2022 official-keyed PYQs
        run: node tests/test_tnpsc_group2_2022_pyqs.mjs
      - name: Validate 2024 Group II/IIA tentative-keyed PYQs and year isolation
        run: node tests/test_tnpsc_group2_2024_pyqs.mjs
      - name: Validate 2025 TNPSC Group II question index and TNUSRB official sources
        run: node tests/test_tnpsc_g2_2025_tnusrb_archive.mjs
      - name: Test live SI-symbol quiz curation
        run: node --test tests/test_textbook_scientific_symbols.mjs
      - name: Test repository-wide textbook validator
        run: python3 -m unittest discover -s tests -p "test_textbook_repository_audit.py" -v
      - name: Test Class 11 History Unit 19 reviewed social-reform MCQs
        run: python3 -m unittest discover -s tests -p "test_class11_history_unit19_reforms.py" -v
      - name: Test Class 11 History Unit 16 European settlement questions
        run: python3 -m unittest discover -s tests -p "test_class11_history_unit16_settlements.py" -v
      - name: Test Class 11 History Unit 14 revised Mughal questions
        run: python3 -m unittest discover -s tests -p "test_class11_history_unit14_duplicates.py" -v
      - name: Test Class 11 History Unit 2 reviewed pottery questions
        run: python3 -m unittest discover -s tests -p "test_class11_history_unit02_pottery.py" -v
      - name: Test Class 7 Science Term III Unit 5 Quiz 7 mixed reasoning review
        run: python3 -m unittest discover -s tests -p "test_class7_science_t3_unit5_quiz07.py" -v
      - name: Test Class 7 Science Term III Unit 5 Quiz 6 applied welfare and safety review
        run: python3 -m unittest discover -s tests -p "test_class7_science_t3_unit5_quiz06.py" -v
      - name: Test Class 7 Science Term III Unit 5 Quiz 5 applied animal-welfare MCQs
        run: python3 -m unittest discover -s tests -p "test_class7_science_t3_unit5_quiz05.py" -v
      - name: Test Class 7 Science Term III Unit 5 Quiz 4 textile hazard review
        run: python3 -m unittest discover -s tests -p "test_class7_science_t3_unit5_quiz04.py" -v
      - name: Test Class 7 Science Term III Unit 5 Quiz 3 wool and sericulture review
        run: python3 -m unittest discover -s tests -p "test_class7_science_t3_unit5_quiz03.py" -v
      - name: Test Class 7 Science Term III Unit 5 Quiz 2 editorial review
        run: python3 -m unittest discover -s tests -p "test_class7_science_t3_unit5_quiz02.py" -v
      - name: Test Class 7 Science Term III Unit 5 Quiz 1 editorial review
        run: python3 -m unittest discover -s tests -p "test_class7_science_t3_unit5_quiz01.py" -v
      - name: Test Class 7 Science Term III Unit 5 full-bank coverage and no duplicate shadow files
        run: python3 -m unittest discover -s tests -p "test_class7_science_t3_unit5_shadow_files.py" -v
      - name: Test Class 7 Science Term II Unit 5 naming accuracy
        run: python3 -m unittest discover -s tests -p "test_class7_science_t2_unit5.py" -v
      - name: Test Class 8 Science Term III Unit 6 and edition-specific sources
        run: python3 -m unittest discover -s tests -p "test_class8_science_t3_unit6.py" -v
      - name: Test Class 8 Science Term III Unit 7 bilingual content
        run: python3 -m unittest discover -s tests -p "test_class8_science_t3_unit7.py" -v
      - name: Test Class 8 Science Term III Unit 8 bilingual content
        run: python3 -m unittest discover -s tests -p "test_class8_science_t3_unit8.py" -v
      - name: Test Class 8 Science Term III Unit 9 bilingual content
        run: python3 -m unittest discover -s tests -p "test_class8_science_t3_unit9.py" -v
      - name: Test Class 10 Science Units 3–5 bilingual quiz quality
        run: python3 -m unittest discover -s tests -p "test_class10_science_units3_5.py" -v
      - name: Test Class 10 Science Units 6–9 bilingual quizzes
        run: python3 -m unittest discover -s tests -p "test_class10_science_units6_9.py" -v
      - name: Test Class 10 Science Units 10–13 bilingual MCQs
        run: python3 -m unittest discover -s tests -p "test_class10_science_units10_13.py" -v
      - name: Test Class 10 Science Units 14–17 bilingual biology MCQs
        run: python3 -m unittest discover -s tests -p "test_class10_science_units14_17.py" -v
      - name: Test Class 10 Science Units 18–21 English–Tamil MCQs
        run: python3 -m unittest discover -s tests -p "test_class10_science_units18_21.py" -v
      - name: Test complete Class 10 Science Units 22–23 bilingual MCQs
        run: python3 -m unittest discover -s tests -p "test_class10_science_units22_23.py" -v
      - name: Test Class 10 Laws of Motion 100-question bilingual editorial batch
        run: python3 -m unittest discover -s tests -p "test_class10_science_unit1_review1_5.py" -v
      - name: Test Class 10 Laws of Motion 100-question review Quizzes 6–10
        run: python3 -m unittest discover -s tests -p "test_class10_science_unit1_review6_10.py" -v
      - name: Test Class 10 Laws of Motion bilingual editorial review Quizzes 11–15
        run: python3 -m unittest discover -s tests -p "test_class10_science_unit1_review11_15.py" -v
      - name: Test Class 10 Laws of Motion bilingual editorial review Quizzes 16–20
        run: python3 -m unittest discover -s tests -p "test_class10_science_unit1_review16_20.py" -v
      - name: Test Class 10 Laws of Motion bilingual editorial review Quizzes 21–25
        run: python3 -m unittest discover -s tests -p "test_class10_science_unit1_review21_25.py" -v
      - name: Test Class 10 Laws of Motion final Quizzes 26–29 and 580-question bank
        run: python3 -m unittest discover -s tests -p "test_class10_science_unit1_review26_29.py" -v
      - name: Test Class 10 Optics 40 bilingual review
        run: python3 -m unittest discover -s tests -p "test_class10_science_optics_40_review.py" -v
      - name: Audit changed textbook question banks across Classes 6–12
        run: python3 scripts/audit_textbook_repository.py --changed-from "origin/${GITHUB_BASE_REF}" --changed-questions-only
      - name: Verify all 19 Class 11 History catalogue counts and the opening question
        run: node tests/test_class11_catalogue.mjs
      - name: Check CDR Contacts copy selection
        run: |
          node --check cdranalysis/js/filters.js
          node --check cdranalysis/js/contacts-insights.js
          node --check cdranalysis/js/contacts-extras.js
          node --check cdranalysis/js/workspace.js
          node --check cdranalysis/js/contacts.js
          node --check cdranalysis/js/app.js
          node --check cdranalysis/js/ui.js
          node --test tests/test_cdr_contacts_copy.mjs tests/test_cdr_contacts_first.mjs tests/test_cdr_contacts_sort.mjs tests/test_cdr_contacts_extras.mjs tests/test_cdr_contacts_integration.mjs
      - name: Audit 100-question English-Tamil History batch
        run: |
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-04.json --start 160 --count 100
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-04.json --start 260 --count 100
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-04.json --start 360 --count 34
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-05.json --start 0 --count 100
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-05.json --start 100 --count 100
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-05.json --start 200 --count 100
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-05.json --start 300 --count 48
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-06.json --start 0 --count 100
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-06.json --start 100 --count 100
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-06.json --start 200 --count 20
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-06.json --start 220 --count 56
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-07.json --start 0 --count 100
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-07.json --start 100 --count 100
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-07.json --start 200 --count 100
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-07.json --start 300 --count 20
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-07.json --start 320 --count 100
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-07.json --start 420 --count 72
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-08.json --start 0 --count 100
          python3 scripts/audit_textbook_quiz_quality.py data/textbook/class-11/history/unit-08.json --start 100 --count 100
          python3 -m unittest discover -s tests -p "test_textbook_batch_audit.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit04_quizzes14_18.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit04_quizzes19_20.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit05_quizzes01_05.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit05_quizzes06_10.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit05_quizzes11_15.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit05_quizzes16_18.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit06_quizzes01_05.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit06_quizzes06_10.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit06_quiz11.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit06_quizzes12_14.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit07_quizzes01_05.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit07_quizzes06_10.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit07_quizzes11_15.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit07_quiz16.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit07_quizzes17_21.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit07_quizzes22_25.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit08_quizzes01_05.py" -v
          python3 -m unittest discover -s tests -p "test_history_unit08_quizzes06_10.py" -v
      - name: Run current affairs text validation tests
        run: python3 -m unittest discover -s tests -p "test_current_affairs_text.py" -v
      - name: Ensure all dated current-affairs sources appear in archive
        run: |
          python3 current-affairs/text/build_text_editions.py
          python3 -m unittest discover -s tests -p "test_current_affairs_archive.py" -v
      - name: Validate the 15 October text source and index
        run: |
          python3 current-affairs/text/build_text_editions.py --validate current-affairs/text/data/2026-10-15.json --date 2026-10-15
          python3 -m json.tool current-affairs/text/editions.json >/dev/null
      - name: Check JavaScript syntax in edited scripts and HTML pages
        run: |
          node --check assets/js/textbook-quality.js
          node --check assets/js/textbook-catalog-controls.js
          node --check assets/js/syllabus-reader.js
          python3 - <<'PY'
          import pathlib, re, subprocess
          files = [
              "daily-quiz.html", "textbook-play.html", "textbook-quiz.html", "ncert-school-book-quiz.html",
              "index.html", "dashboard.html", "search.html",
              "current-affairs/text/index.html", "current-affairs/text/2026-10-15.html",
          ]
          script_pattern = re.compile(r"<script\\b([^>]*)>(.*?)</script>", re.I | re.S)
          total = 0
          for name in files:
              html = pathlib.Path(name).read_text(encoding="utf-8")
              for match in script_pattern.finditer(html):
                  attrs, code = match.groups()
                  if not code.strip() or re.search(r"application/ld\\+json", attrs, re.I):
                      continue
                  result = subprocess.run(["node", "--check"], input=code, text=True, capture_output=True)
                  if result.returncode:
                      raise SystemExit(f"{name}: invalid JavaScript\\n{result.stderr}")
                  total += 1
          print(f"Validated {total} inline scripts across {len(files)} HTML pages.")
          PY
