name: Verify live Firsts Quiz deployment
on:
  pull_request:
    paths:
      - '.github/workflows/live-firsts-verify.yml'
  workflow_dispatch:
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify live custom domain serves merged Firsts Quiz
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json
          import socket
          import urllib.error
          import urllib.request

          host = 'clearexams.ink'
          try:
              print('DNS:', sorted({row[4][0] for row in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)}))
          except Exception as exc:
              print('DNS failure:', repr(exc))
              raise

          def get(path):
              url = 'https://' + host + path
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (ClearExams deployment verification)'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read()
                      print('HTTP', response.status, response.url, 'bytes', len(body))
                      return body.decode('utf-8')
              except Exception as exc:
                  print('Request failed:', url, repr(exc))
                  raise

          html = get('/textbook-firsts.html')
          bank = json.loads(get('/data/special-quizzes/firsts.json'))
          home = get('/')
          questions = bank['questions']
          expected = [
              (len(questions)==148,'148 questions'),
              (bank['meta']['version']>=11,'updated bank v11'),
              (bank['meta']['quiz_size']==20,'20-question sets'),
              ('id="skip"' in html,'skip control deployed'),
              ('id="unanswered"' in html,'unanswered result deployed'),
              ("$('set').value='1'" in html,'20-question default deployed'),
              ('other pioneers · 26 MCQs.' in home,'women count corrected'),
              ('major events · 96 MCQs.' in home,'history count corrected'),
              ('discoveries · 26 MCQs.' in home,'science count corrected'),
              (next(q for q in questions if q['id']=='F042')['opts_en']==['1814','1824','1834','1844'],'F042 corrected'),
              (next(q for q in questions if q['id']=='F052')['opts_en']==['1206','1192','1191','1194'],'F052 corrected'),
          ]
          for passed, name in expected:
              print(('PASS' if passed else 'FAIL'), name)
          if not all(p for p,_ in expected):
              raise SystemExit('Live deployment does not match the merged Firsts release')
          print('CONFIRMED: public live URLs serve the corrected Firsts release')
          PY
