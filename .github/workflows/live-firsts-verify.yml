name: Verify live Firsts Quiz deployment
on:
  pull_request:
    paths:
      - '.github/workflows/live-firsts-verify.yml'
  workflow_dispatch:
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify live custom domain serves merged Firsts Quiz
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json
          import socket
          import urllib.error
          import urllib.request

          host = 'clearexams.ink'
          try:
              print('DNS:', sorted({row[4][0] for row in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)}))
          except Exception as exc:
              print('DNS failure:', repr(exc))
              raise

          def get(path):
              url = 'https://' + host + path
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (ClearExams deployment verification)'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read()
                      print('HTTP', response.status, response.url, 'bytes', len(body))
                      return body.decode('utf-8')
              except Exception as exc:
                  print('Request failed:', url, repr(exc))
                  raise

          html = get('/textbook-firsts.html')
          bank = json.loads(get('/data/special-quizzes/firsts.json'))
          home = get('/')
          questions = bank['questions']
          expected_repo = json.loads(open('data/special-quizzes/firsts.json',encoding='utf-8').read())
          print('LIVE_RELEASE:', len(questions), 'questions, version', bank.get('meta',{}).get('version'), 'last ID', questions[-1]['id'] if questions else '-')
          print('REPO_RELEASE:', len(expected_repo['questions']), 'questions, version', expected_repo.get('meta',{}).get('version'))
          if len(questions) < 165 or not any(q.get('id') == 'F165' for q in questions):
              raise SystemExit('Public GitHub Pages deployment is still on an earlier Firsts edition; latest version 17 is not yet served')
          expected = [
              (len(questions)==165,'165 questions'),
              (bank['meta']['version']>=17,'updated bank v17'),
              (bank['meta']['quiz_size']==20,'20-question sets'),
              ('id="skip"' in html,'skip control deployed'),
              ('id="unanswered"' in html,'unanswered result deployed'),
              ("$('set').value='1'" in html,'20-question default deployed'),
              ('other pioneers · 27 MCQs.' in home,'women count corrected'),
              ('major events · 107 MCQs.' in home,'history count corrected'),
              ('discoveries · 31 MCQs.' in home,'science count corrected'),
              (next(q for q in questions if q['id']=='F042')['opts_en']==['1814','1824','1834','1844'],'F042 corrected'),
              (next(q for q in questions if q['id']=='F052')['opts_en']==['1206','1192','1191','1194'],'F052 corrected'),
              (next(q for q in questions if q['id']=='F149')['opts_en'][0]=='Viswanathan Anand','new Class 6 chess Firsts question'),
              (next(q for q in questions if q['id']=='F150')['opts_en'][0]=='William Herschel','new Class 6 Uranus Firsts question'),
              (next(q for q in questions if q['id']=='F151')['opts_en'][0]=='Chandrayaan-1','new Class 6 Moon Firsts question'),
              (all('cloudfront.net' in next(q for q in questions if q['id']==id)['source_ta_link'] for id in ('F033','F034','F035','F043','F044','F149','F150','F151')),'original Tamil source links deployed'),
              (next(q for q in questions if q['id']=='F041')['opts_en'][2]=='Robert Hooke','Class 6 Term II Hooke answer'),
              (next(q for q in questions if q['id']=='F152')['opts_en'][1]=='Mahapadma Nanda','new First Nanda ruler fact'),
              (next(q for q in questions if q['id']=='F153')['opts_en'][0]=='Gudiyatham','new Independence flag weaving fact'),
              (next(q for q in questions if q['id']=='F154')['opts_en'][2]=='1911','new Jana Gana Mana first performance fact'),
              (all('cleartnpsc.com' in next(q for q in questions if q['id']==id)['source_ta_link'] for id in ('F041','F152','F153','F154')),'original Tamil Term II source PDFs deployed'),
              (next(q for q in questions if q['id']=='F049')['opts_en']==['Indian mariners','Chinese mariners','European mariners','Egyptian mariners'],'duplicate Chinese/China options fixed live'),
              (next(q for q in questions if q['id']=='F155')['opts_en'][1]=='Chennai Municipal Corporation','new oldest local body historical first'),
              (next(q for q in questions if q['id']=='F156')['opts_en'][2]=='New Zealand','new 1893 women voting first'),
              (all('class-6-term-3-' in next(q for q in questions if q['id']==id)['source_ta_link'] for id in ('F042','F045','F046','F047','F048','F049','F155','F156')),'direct bilingual SCERT Term III source PDFs deployed'),
              (all(next(q for q in questions if q['id']==id)['source_ta_pdf_page']>0 for id in ('F042','F045','F046','F047','F048','F049','F155','F156')),'original Tamil PDF page indices deployed'),
              (next(q for q in questions if q['id']=='F157')['opts_en'][0]=='Robert Boyle','new Class 7 Boyle pioneer question'),
              (next(q for q in questions if q['id']=='F158')['opts_en'][1]=='John Dalton','new Class 7 Dalton symbol question'),
              (next(q for q in questions if q['id']=='F159')['opts_en'][1]=='Gopala','new Pala dynasty founder question'),
              (next(q for q in questions if q['id']=='F160')['opts_en'][1]=="Taj-ul-Ma'asir",'new first official Delhi history question'),
              (next(q for q in questions if q['id']=='F161')['opts_en'][0]=='Razia Sultan','new Delhi woman ruler question'),
              (next(q for q in questions if q['id']=='F053')['opts_en'][0]=='Prithviraj Chauhan' and 'Rajputana' not in next(q for q in questions if q['id']=='F053')['opts_en'],'Tarain distractors repaired'),
              (all('class-7-term-1-' in next(q for q in questions if q['id']==id)['source_ta_link'] for id in ('F051','F052','F053','F054','F157','F158','F159','F160','F161')),'original Tamil Class 7 Term I source links deployed'),
              (all(next(q for q in questions if q['id']==id)['source_ta_pdf_page']>0 for id in ('F051','F052','F053','F054','F157','F158','F159','F160','F161')),'Class 7 term I Tamil PDF page indexes deployed'),
              (next(q for q in questions if q['id']=='F162')['opts_en'][1]=='Alessandro Volta','new Volta battery original-source question'),
              (next(q for q in questions if q['id']=='F163')['opts_en'][0]=='Harihara and Bukka','new Vijayanagara foundation source question'),
              (next(q for q in questions if q['id']=='F164')['opts_en'][0]=='Babur','new Mughal Empire founder source question'),
              (next(q for q in questions if q['id']=='F165')['opts_en'][1]=='Akbar','new Akbar Mansabdari source question'),
              (all('class-7-term-2-' in next(q for q in questions if q['id']==id)['source_ta_link'] for id in ('F050','F055','F162','F163','F164','F165')),'Class 7 Term II original Tamil source links live'),
              (all(next(q for q in questions if q['id']==id)['source_ta_pdf_page']>0 for id in ('F050','F055','F162','F163','F164','F165')),'Class 7 Term II Tamil page indexes live'),
                            (bank==json.loads(open('data/special-quizzes/firsts.json',encoding='utf-8').read()),'full live JSON matches merged repository bank'),
          ]
          for passed, name in expected:
              print(('PASS' if passed else 'FAIL'), name)
          if not all(p for p,_ in expected):
              raise SystemExit('Live deployment does not match the merged Firsts release')
          print('CONFIRMED: public live URLs serve complete Class 7 Term II-reviewed Firsts release 165/v17')
          PY
