name: Verify live Firsts Quiz deployment
on:
  pull_request:
    paths:
      - '.github/workflows/live-firsts-verify.yml'
  workflow_dispatch:
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify live custom domain serves merged Firsts Quiz
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json
          import socket
          import urllib.error
          import urllib.request

          host = 'clearexams.ink'
          try:
              print('DNS:', sorted({row[4][0] for row in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)}))
          except Exception as exc:
              print('DNS failure:', repr(exc))
              raise

          def get(path):
              url = 'https://' + host + path
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (ClearExams deployment verification)'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read()
                      print('HTTP', response.status, response.url, 'bytes', len(body))
                      return body.decode('utf-8')
              except Exception as exc:
                  print('Request failed:', url, repr(exc))
                  raise

          html = get('/textbook-firsts.html')
          bank = json.loads(get('/data/special-quizzes/firsts.json'))
          home = get('/')
          questions = bank['questions']
          expected_repo = json.loads(open('data/special-quizzes/firsts.json',encoding='utf-8').read())
          print('LIVE_RELEASE:', len(questions), 'questions, version', bank.get('meta',{}).get('version'), 'last ID', questions[-1]['id'] if questions else '-')
          print('REPO_RELEASE:', len(expected_repo['questions']), 'questions, version', expected_repo.get('meta',{}).get('version'))
          if len(questions) < 182 or not any(q.get('id') == 'F182' for q in questions):
              raise SystemExit('Public GitHub Pages deployment is still on an earlier Firsts edition; latest version 21 is not yet served')
          expected = [
              (len(questions)==182,'182 questions'),
              (bank['meta']['version']>=21,'updated bank v21'),
              (bank['meta']['quiz_size']==20,'20-question sets'),
              ('id="skip"' in html,'skip control deployed'),
              ('id="unanswered"' in html,'unanswered result deployed'),
              ("$('set').value='1'" in html,'20-question default deployed'),
              ('other pioneers · 27 MCQs.' in home,'women count corrected'),
              ('major events · 113 MCQs.' in home,'history count corrected'),
              ('discoveries · 42 MCQs.' in home,'science count corrected'),
              (next(q for q in questions if q['id']=='F042')['opts_en']==['1814','1824','1834','1844'],'F042 corrected'),
              (next(q for q in questions if q['id']=='F052')['opts_en']==['1206','1192','1191','1194'],'F052 corrected'),
              (next(q for q in questions if q['id']=='F149')['opts_en'][0]=='Viswanathan Anand','new Class 6 chess Firsts question'),
              (next(q for q in questions if q['id']=='F150')['opts_en'][0]=='William Herschel','new Class 6 Uranus Firsts question'),
              (next(q for q in questions if q['id']=='F151')['opts_en'][0]=='Chandrayaan-1','new Class 6 Moon Firsts question'),
              (all('cloudfront.net' in next(q for q in questions if q['id']==id)['source_ta_link'] for id in ('F033','F034','F035','F043','F044','F149','F150','F151')),'original Tamil source links deployed'),
              (next(q for q in questions if q['id']=='F041')['opts_en'][2]=='Robert Hooke','Class 6 Term II Hooke answer'),
              (next(q for q in questions if q['id']=='F152')['opts_en'][1]=='Mahapadma Nanda','new First Nanda ruler fact'),
              (next(q for q in questions if q['id']=='F153')['opts_en'][0]=='Gudiyatham','new Independence flag weaving fact'),
              (next(q for q in questions if q['id']=='F154')['opts_en'][2]=='1911','new Jana Gana Mana first performance fact'),
              (all('cleartnpsc.com' in next(q for q in questions if q['id']==id)['source_ta_link'] for id in ('F041','F152','F153','F154')),'original Tamil Term II source PDFs deployed'),
              (next(q for q in questions if q['id']=='F049')['opts_en']==['Indian mariners','Chinese mariners','European mariners','Egyptian mariners'],'duplicate Chinese/China options fixed live'),
              (next(q for q in questions if q['id']=='F155')['opts_en'][1]=='Chennai Municipal Corporation','new oldest local body historical first'),
              (next(q for q in questions if q['id']=='F156')['opts_en'][2]=='New Zealand','new 1893 women voting first'),
              (all('class-6-term-3-' in next(q for q in questions if q['id']==id)['source_ta_link'] for id in ('F042','F045','F046','F047','F048','F049','F155','F156')),'direct bilingual SCERT Term III source PDFs deployed'),
              (all(next(q for q in questions if q['id']==id)['source_ta_pdf_page']>0 for id in ('F042','F045','F046','F047','F048','F049','F155','F156')),'original Tamil PDF page indices deployed'),
              (next(q for q in questions if q['id']=='F157')['opts_en'][0]=='Robert Boyle','new Class 7 Boyle pioneer question'),
              (next(q for q in questions if q['id']=='F158')['opts_en'][1]=='John Dalton','new Class 7 Dalton symbol question'),
              (next(q for q in questions if q['id']=='F159')['opts_en'][1]=='Gopala','new Pala dynasty founder question'),
              (next(q for q in questions if q['id']=='F160')['opts_en'][1]=="Taj-ul-Ma'asir",'new first official Delhi history question'),
              (next(q for q in questions if q['id']=='F161')['opts_en'][0]=='Razia Sultan','new Delhi woman ruler question'),
              (next(q for q in questions if q['id']=='F053')['opts_en'][0]=='Prithviraj Chauhan' and 'Rajputana' not in next(q for q in questions if q['id']=='F053')['opts_en'],'Tarain distractors repaired'),
              (all('class-7-term-1-' in next(q for q in questions if q['id']==id)['source_ta_link'] for id in ('F051','F052','F053','F054','F157','F158','F159','F160','F161')),'original Tamil Class 7 Term I source links deployed'),
              (all(next(q for q in questions if q['id']==id)['source_ta_pdf_page']>0 for id in ('F051','F052','F053','F054','F157','F158','F159','F160','F161')),'Class 7 term I Tamil PDF page indexes deployed'),
              (next(q for q in questions if q['id']=='F162')['opts_en'][1]=='Alessandro Volta','new Volta battery original-source question'),
              (next(q for q in questions if q['id']=='F163')['opts_en'][0]=='Harihara and Bukka','new Vijayanagara founding source question'),
              (next(q for q in questions if q['id']=='F164')['opts_en'][0]=='Babur','new Mughal Empire founder source question'),
              (next(q for q in questions if q['id']=='F165')['opts_en'][1]=='Akbar','new Akbar Mansabdari source question'),
              (all('class-7-term-2-' in next(q for q in questions if q['id']==id)['source_ta_link'] for id in ('F050','F055','F162','F163','F164','F165')),'Class 7 Term II original Tamil source links live'),
              (all(next(q for q in questions if q['id']==id)['source_ta_pdf_page']>0 for id in ('F050','F055','F162','F163','F164','F165')),'Class 7 Term II original Tamil PDF page indexes live'),
              (next(q for q in questions if q['id']=='F166')['opts_en'][0]=='Rohini RS-1','Class 7 Term III indigenous Rohini first'),
              (next(q for q in questions if q['id']=='F167')['opts_en'][0]=='Mars Orbiter Mission (Mangalyaan)','first Indian Mars mission'),
              (next(q for q in questions if q['id']=='F168')['opts_en'][0]=='Pataliputra','first Jain council tradition'),
              (next(q for q in questions if q['id']=='F169')['opts_en'][0]=='Mahendravarman I','Mandagapattu Pallava pioneer'),
              (next(q for q in questions if q['id']=='F170')['opts_en'][0]=='Alexander Fleming','1928 penicillin discovery'),
              (all('class-7-term-3-' in next(q for q in questions if q['id']==id)['source_ta_link'] for id in ('F166','F167','F168','F169','F170')),'Class 7 Term III Tamil original PDF sources deployed'),
              (all(next(q for q in questions if q['id']==id)['source_ta_pdf_page']>0 for id in ('F166','F167','F168','F169','F170')),'five source-backed Tamil PDF page indexes deployed'),
              (next(q for q in questions if q['id']=='F171')['opts_en'][0]=='Puducherry (Pondicherry)','Class 8 first KVK Puducherry'),
              (next(q for q in questions if q['id']=='F172')['opts_en'][0]=='Satyendranath Tagore','Class 8 first Indian ICS candidate'),
              (next(q for q in questions if q['id']=='F173')['opts_en'][0]=='William Gilbert','Class 8 Gilbert versorium electroscope'),
              (next(q for q in questions if q['id']=='F174')['opts_en'][0]=='Francisco de Almeida','Class 8 first Portuguese viceroy'),
              (all('class-8-' in next(q for q in questions if q['id']==id)['source_ta_link'] for id in ('F036','F037','F038','F057','F117','F118','F171','F172','F173','F174')),'Class 8 direct original Tamil source links deployed'),
              (all(next(q for q in questions if q['id']==id)['source_ta_pdf_page']>0 for id in ('F036','F037','F038','F057','F117','F118','F171','F172','F173','F174')),'Class 8 original Tamil physical PDF page indexes live'),
              (next(q for q in questions if q['id']=='F175')['opts_en'][0]=='Robert Bruce Foote','Class 9 first Palaeolithic tools at Pallavaram'),
              (next(q for q in questions if q['id']=='F176')['opts_en'][0]=='Minamoto no Yoritomo','Class 9 Kamakura shogunate origin'),
              (next(q for q in questions if q['id']=='F177')['opts_en'][0]=='Ole Rømer','Class 9 1676 finite speed of light'),
              (next(q for q in questions if q['id']=='F178')['opts_en'][0]=='Joseph E. Murray','Class 9 first successful 1954 kidney transplant'),
              (all('class-9-' in next(q for q in questions if q['id']==id)['source_ta_link'] for id in ('F058','F175','F176','F177','F178')),'five Class 9 original Tamil source links deployed'),
              (all(next(q for q in questions if q['id']==id)['source_ta_pdf_page']>0 for id in ('F058','F175','F176','F177','F178')),'Class 9 selected original Tamil page indexes deployed'),
              (all('class-9-social-science-english.pdf' in next(q for q in questions if q['id']==id)['source_link'] for id in ('F122','F123','F124','F125','F126','F127','F128','F129','F130','F131','F132','F133')),'twelve older Class 9 English original links refreshed'),
              (all(next(q for q in questions if q['id']==id).get('historical_source_link') for id in ('F122','F123','F124','F125','F126','F127','F128','F129','F130','F131','F132','F133')),'older Class 9 audit original 2020 links retained'),
              (next(q for q in questions if q['id']=='F039')['opts_en'][next(q for q in questions if q['id']=='F039')['correct']]=='Sputnik 1' and '1957' in next(q for q in questions if q['id']=='F039')['q_en'],'Sputnik 1957 historical correction preserved'),
              (next(q for q in questions if q['id']=='F177')['source_conflict']['independently_verified_year']=='1676','Rømer wrong textbook year documented'),
              (next(q for q in questions if q['id']=='F179')['opts_en'][0]=='Apsara','Class 10 first research reactor Apsara'),
              (next(q for q in questions if q['id']=='F180')['opts_en'][0]=='Tarapur Atomic Power Station','Class 10 first nuclear electricity station Tarapur'),
              (next(q for q in questions if q['id']=='F181')['opts_en'][0]=='Homi Jehangir Bhabha','Class 10 original AEC first chair'),
              (next(q for q in questions if q['id']=='F182')['opts_en'][1]=='1952','Class 10 national family planning year'),
              (all('class-10-' in next(q for q in questions if q['id']==id)['source_ta_link'] for id in ('F106','F110','F111','F112','F113','F115','F116','F179','F180','F181','F182')),'Class 10 original Tamil PDF links deployed'),
              (all(next(q for q in questions if q['id']==id)['source_ta_pdf_page']>0 for id in ('F106','F110','F111','F112','F113','F115','F116','F179','F180','F181','F182')),'Class 10 source PDF page indexes deployed'),
              (next(q for q in questions if q['id']=='F019')['source_conflict']['status']=='open_requires_original_edition_comparison','Swadesamitran date conflict remains open'),
                            (bank==json.loads(open('data/special-quizzes/firsts.json',encoding='utf-8').read()),'full live JSON matches merged repository bank'),
          ]
          for passed, name in expected:
              print(('PASS' if passed else 'FAIL'), name)
          if not all(p for p,_ in expected):
              raise SystemExit('Live deployment does not match the merged Firsts release')
          print('CONFIRMED: public live URLs serve complete Class 10 bilingual-selected-originals Firsts release 182/v21')
          PY
