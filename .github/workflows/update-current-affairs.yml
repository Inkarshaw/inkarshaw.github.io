name: Update current affairs PDF list

on:
  push:
    branches: ["main"]
    paths:
      - "current-affairs/*.pdf"
      - "current-affairs/build-compilations.py"
      - ".github/workflows/update-current-affairs.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: current-affairs-pdf-list
  cancel-in-progress: false

jobs:
  update-pdf-list:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install compilation dependency
        run: pip install pypdf

      - name: Generate newest-first PDF list
        run: python3 current-affairs/generate-pdf-list.py

      - name: Build weekly and monthly compilations
        run: python3 current-affairs/build-compilations.py

      - name: Commit generated current-affairs indexes and compilations
        run: |
          if git diff --quiet -- current-affairs/pdfs.json current-affairs/compilations; then
            echo "Current-affairs indexes and compilations are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-affairs/pdfs.json current-affairs/compilations
          git commit -m "Update current affairs lists and compilations"
          git status --short
          git pull --rebase --autostash origin main
          git push

      - name: Trigger Pages deployment and production health check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run jekyll-gh-pages.yml --ref main
          gh workflow run site-health.yml --ref main
