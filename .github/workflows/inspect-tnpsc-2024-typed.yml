name: Inspect source text for TNPSC Group IV 2024 quiz
on:
  push:
    branches: [feat/tnpsc-g4-2024-200-text-quiz-20261108]
    paths: [scripts/inspect_tnpsc_2024_typed.py]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - run: python scripts/inspect_tnpsc_2024_typed.py
