name: Audit Class 7 Term II original English Tamil books
on:
  pull_request:
    paths:
      - scripts/audit_class7_term2_originals.py
      - scripts/review_class7_term2_source_pages.py
      - .github/workflows/class7-term2-original-audit.yml
  workflow_dispatch:
jobs:
  original-books:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf
      - name: Extract original English and Tamil PDFs
        run: python scripts/audit_class7_term2_originals.py
      - name: Collect selected English and Tamil original page evidence
        run: python scripts/review_class7_term2_source_pages.py
      - name: Preserve short excerpts and internal page images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class7-term2-private-source-page-review
          path: |
            data/textbook/class7-term2-source-probe-2026-11-01.json
            data/textbook/_class7_term2_private_review_images/
          if-no-files-found: warn
      - name: Preserve evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class7-term2-original-pdf-evidence
          path: data/textbook/class7-term2-original-audit-2026-11-01.json
          if-no-files-found: warn
