name: Sync official exam calendar

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sync-exam-calendar.yml'
      - 'scripts/sync_exam_calendar.py'
      - 'tests/test_exam_calendar_sync.py'
      - 'data/exams/exam-notifications.json'
  schedule:
    - cron: "23 0 * * *" # Daily at 05:53 IST, subject to GitHub scheduling delays.

permissions:
  contents: write

concurrency:
  group: exam-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test official importer (fail closed)
        run: python3 -m unittest discover -s tests -p 'test_exam_calendar_sync.py' -v

      - name: Read official TNPSC notifications
        if: github.event_name != 'pull_request'
        run: python3 scripts/sync_exam_calendar.py

      - name: Validate resulting JSON
        run: python3 -m json.tool data/exams/exam-notifications.json > /dev/null

      - name: Publish only approved calendar data changes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exams/exam-notifications.json
          if git diff --cached --quiet; then
            echo "No new official TNPSC date changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Sync official TNPSC examination dates"
          git pull --rebase origin main
          git push origin main
          echo "Published verified TNPSC calendar changes." >> "$GITHUB_STEP_SUMMARY"
