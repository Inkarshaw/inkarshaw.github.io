name: Legacy textbook bank and catalogue inventory

on:
  pull_request:
    paths:
      - ".github/workflows/legacy-textbook-audit.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/legacy-textbook-audit.yml"
      - "scripts/audit_textbook_repository.py"
      - "data/textbook/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Full legacy bank and catalogue diagnostics (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit every bank; retain diagnostics without blocking existing PRs
        run: |
          python3 scripts/audit_textbook_repository.py --all --json > legacy-textbook-audit.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/textbook")
          report = json.loads(Path("legacy-textbook-audit.json").read_text(encoding="utf-8"))
          print(f"STRUCTURE: {report['banks_audited']} banks, {report['questions_audited']} questions, "
                f"{report['errors']} errors, {report['warnings']} non-blocking editorial warnings.")
          for bank in report["banks"]:
              if bank["errors"]:
                  print(f"ERROR BANK {bank['path']}: {len(bank['errors'])} issues")
                  for message in bank["errors"][:4]:
                      print(" ", message)

          inventory = {"indexes": [], "mismatches": [], "unindexed_subject_folders": []}
          indexed_dirs = set()
          for index_path in sorted(root.rglob("index.json")):
              indexed_dirs.add(index_path.parent)
              try:
                  index = json.loads(index_path.read_text(encoding="utf-8"))
              except (OSError, ValueError) as error:
                  inventory["mismatches"].append(f"{index_path}: unreadable index: {error}")
                  continue
              meta = index.get("meta") or {}
              units = index.get("units") or []
              details = {"index": str(index_path), "units": [], "alternate_indexes": []}
              for other in sorted(index_path.parent.glob("index-*.json")):
                  details["alternate_indexes"].append(str(other))
              for unit in units:
                  name = unit.get("path")
                  if not isinstance(name, str) or not name:
                      inventory["mismatches"].append(f"{index_path}: unit {unit.get('id')} lacks path")
                      continue
                  path = index_path.parent / name
                  ready = bool(unit.get("ready"))
                  files = [path] if path.exists() else []
                  files += sorted(index_path.parent.glob(path.stem + "-quiz-*.json"))
                  all_ids, seen = [], set()
                  fragments = 0
                  for file in files:
                      try:
                          data = json.loads(file.read_text(encoding="utf-8"))
                          records = data.get("questions", []) if isinstance(data, dict) else []
                          if not isinstance(records, list):
                              records = []
                      except (OSError, ValueError):
                          inventory["mismatches"].append(f"{file}: invalid JSON")
                          continue
                      if file != path:
                          fragments += len(records)
                      for position, q in enumerate(records):
                          ident = q.get("id") if isinstance(q, dict) else None
                          # Repeated IDs in a continuation file are not double-counted.
                          all_ids.append(ident or f"{file}:{position}")
                  unique_count = len(set(all_ids))
                  duplicated_count = len(all_ids) - unique_count
                  unit_info = {"id": unit.get("id"), "ready": ready, "path": str(path),
                               "declared": unit.get("total"), "bank_exists": path.exists(),
                               "unique_questions": unique_count, "continuation_questions": fragments,
                               "duplicate_ids_across_files": duplicated_count}
                  details["units"].append(unit_info)
                  if ready and not path.exists():
                      inventory["mismatches"].append(f"{path}: marked ready, but bank is missing")
                  if ready and isinstance(unit.get("total"), int) and unique_count != unit["total"]:
                      inventory["mismatches"].append(
                          f"{path}: catalog total {unit['total']}, available unique questions {unique_count} "
                          f"({fragments} continuation records)")
                  if ready and isinstance(unit.get("quiz_count"), int):
                      expected = (unique_count + 19) // 20
                      if expected != unit["quiz_count"]:
                          inventory["mismatches"].append(
                              f"{path}: catalog quiz_count {unit['quiz_count']}, unique records imply {expected}")
                  if ready and duplicated_count:
                      inventory["mismatches"].append(
                          f"{path}: {duplicated_count} repeated IDs across main and continuation files")
              for field, unitfield in (("total_questions", "total"), ("total_quiz_sets", "quiz_count")):
                  if isinstance(meta.get(field), int):
                      declared = sum(unit.get(unitfield) or 0 for unit in units if unit.get("ready"))
                      if meta[field] != declared:
                          inventory["mismatches"].append(
                              f"{index_path}: meta.{field}={meta[field]}, sum ready units={declared}")
              inventory["indexes"].append(details)

          for folder in sorted({p.parent for p in root.rglob("unit-*.json")} - indexed_dirs):
              inventory["unindexed_subject_folders"].append(str(folder))
          Path("textbook-catalog-inventory.json").write_text(
              json.dumps(inventory, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"CATALOG: {len(inventory['indexes'])} indexes, {len(inventory['mismatches'])} "
                f"count/readiness/duplicate-ID discrepancies, "
                f"{len(inventory['unindexed_subject_folders'])} folders without index.json.")
          for issue in inventory["mismatches"][:70]:
              print("CATALOG ISSUE", issue)
          print("FOLDERS WITHOUT INDEX", ", ".join(inventory["unindexed_subject_folders"][:30]))
          PY
      - name: Upload full machine-readable legacy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: textbook-legacy-inventory
          path: |
            legacy-textbook-audit.json
            textbook-catalog-inventory.json
          retention-days: 30
