name: ClearExams content trust and user experience checks

on:
  pull_request:
    paths:
      - "pyq-hub.html"
      - "tnusrb-si-2010-quiz.html"
      - "tnusrb-si-2020-quiz.html"
      - "assets/js/tnusrb-si-2020-quiz.js"
      - "data/quizzes/tnusrb-si-2020-series-c.json"
      - "tests/test_tnusrb_si_2020_quiz.mjs"
      - "assets/js/tnusrb-si-2010-quiz.js"
      - "data/quizzes/tnusrb-si-2010-open-type-a.json"
      - "tests/test_tnusrb_si_2010_quiz.mjs"
      - "pyq-original-paper.html"
      - "pyq-original-digital.html"
      - "pyq-digitize.html"
      - "assets/js/pyq-digitize.js"
      - "assets/js/pyq-draft-schema.js"
      - "tests/test_pyq_digitize_workbench.mjs"
      - "data/quizzes/verified-full-original-papers.json"
      - "tests/test_pyq_original_full_gate.mjs"
      - "pyq-full-quiz.html"
      - "data/quizzes/original-paper-practice.json"
      - "tests/test_pyq_original_paper.mjs"
      - "daily-quiz.html"
      - "textbook-play.html"
      - "textbook-topics.html"
      - "textbook-quiz.html"
      - "data/textbook/class-12/history/index.json"
      - "data/textbook/class-12/history/unit-1.json"
      - "tests/test_textbook_topic_quiz.mjs"
      - "tn-school-notes.html"
      - "dashboard.html"
      - "exam-calendar.html"
      - "assets/js/notes-quality.js"
      - "index.html"
      - "tnpsc.html"
      - "upsc.html"
      - "current-affairs/text/index.html"
      - "assets/js/exam-notifications.js"
      - "sitemap.xml"
      - ".github/workflows/current-affairs-freshness.yml"
      - "tests/test_commercial_readiness.py"
      - "scripts/check_current_affairs_freshness.py"
      - "tests/test_current_affairs_publishing_health.py"
      - ".github/workflows/current-affairs-freshness.yml"
      - ".github/workflows/jekyll-gh-pages.yml"
      - "assets/js/calendar-freshness.js"
      - "assets/js/progress-transfer.js"
      - "data/exams/review-schedule.json"
      - "data/quizzes/verified-pyqs.json"
      - "tests/test_content_trust.mjs"
      - "tests/test_tnpsc_g4_2024_final_key.mjs"
      - "data/quizzes/tnpsc-g4-2024-original-questions.json"
      - "data/quizzes/tnpsc-g4-2024-ocr-page-draft.json"
      - "tests/test_tnpsc_g4_2024_source_json.mjs"
      - "assets/js/tn-school-notes-data.js"
      - "scripts/audit_pyq_year_coverage.py"
  push:
    branches: [main]
    paths:
      - "pyq-hub.html"
      - "tnusrb-si-2010-quiz.html"
      - "tnusrb-si-2020-quiz.html"
      - "assets/js/tnusrb-si-2020-quiz.js"
      - "data/quizzes/tnusrb-si-2020-series-c.json"
      - "tests/test_tnusrb_si_2020_quiz.mjs"
      - "assets/js/tnusrb-si-2010-quiz.js"
      - "data/quizzes/tnusrb-si-2010-open-type-a.json"
      - "tests/test_tnusrb_si_2010_quiz.mjs"
      - "pyq-original-paper.html"
      - "pyq-original-digital.html"
      - "pyq-digitize.html"
      - "assets/js/pyq-digitize.js"
      - "assets/js/pyq-draft-schema.js"
      - "tests/test_pyq_digitize_workbench.mjs"
      - "data/quizzes/verified-full-original-papers.json"
      - "tests/test_pyq_original_full_gate.mjs"
      - "pyq-full-quiz.html"
      - "data/quizzes/original-paper-practice.json"
      - "tests/test_pyq_original_paper.mjs"
      - "daily-quiz.html"
      - "textbook-play.html"
      - "textbook-topics.html"
      - "textbook-quiz.html"
      - "data/textbook/class-12/history/index.json"
      - "data/textbook/class-12/history/unit-1.json"
      - "tests/test_textbook_topic_quiz.mjs"
      - "tn-school-notes.html"
      - "dashboard.html"
      - "exam-calendar.html"
      - "assets/js/**"
      - "data/exams/review-schedule.json"
      - "data/quizzes/verified-pyqs.json"
      - "tests/test_content_trust.mjs"
      - "tests/test_tnpsc_g4_2024_final_key.mjs"
      - "data/quizzes/tnpsc-g4-2024-original-questions.json"
      - "data/quizzes/tnpsc-g4-2024-ocr-page-draft.json"
      - "tests/test_tnpsc_g4_2024_source_json.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test content quality and user interactions
        run: node tests/test_content_trust.mjs
      - name: Validate TNUSRB SI 2010 user-supplied quiz and Type A source gaps
        run: node tests/test_tnusrb_si_2010_quiz.mjs
      - name: Validate TNUSRB SI 2020 user-supplied quiz and Series C final key
        run: node tests/test_tnusrb_si_2020_quiz.mjs
      - name: Verify commercial navigation and publication trust
        run: python3 -m unittest discover -s tests -p 'test_commercial_readiness.py'
      - name: Test live Current Affairs publishing and source freshness guards
        run: python3 -m unittest discover -s tests -p 'test_current_affairs_publishing_health.py' -v
      - name: Validate TN textbook topic quiz and bilingual coverage
        run: node tests/test_textbook_topic_quiz.mjs
      - name: Reconcile new 2024 Group IV questions with official final key
        run: node tests/test_tnpsc_g4_2024_final_key.mjs
      - name: Validate 200 extracted original-number JSON records without false verification
        run: node tests/test_tnpsc_g4_2024_source_json.mjs
      - name: Validate full bilingual Group IIA notes
        run: node tests/test_group2a_text_notes.mjs
      - name: Enforce full original-paper license, completeness, sequence and final-key gate
        run: node tests/test_pyq_original_full_gate.mjs
      - name: Validate original full-paper PDF companion without transcription claims
        run: node tests/test_pyq_original_paper.mjs
      - name: Validate local original-PYQ verbatim digitization workbench
        run: node tests/test_pyq_digitize_workbench.mjs
      - name: Validate year-wise PYQ routing
        run: node tests/test_pyq_yearwise.mjs
      - name: Audit source-attributed PYQ coverage
        run: python3 scripts/audit_pyq_year_coverage.py
      - name: Check scheduled board review policy
        run: python3 scripts/audit_calendar_freshness.py
