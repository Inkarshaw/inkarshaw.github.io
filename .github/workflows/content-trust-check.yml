  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test content quality and user interactions
        run: node tests/test_content_trust.mjs
      - name: Validate TNUSRB SI 2010 user-supplied quiz and Type A source gaps
        run: node tests/test_tnusrb_si_2010_quiz.mjs
      - name: Validate TNUSRB SI 2020 user-supplied quiz and Series C final key
        run: node tests/test_tnusrb_si_2020_quiz.mjs
      - name: Validate TNUSRB SI 2015 bilingual OCR and disputed secondary keys
        run: node tests/test_tnusrb_si_2015_quiz.mjs
      - name: Verify original source gaps cannot become graded or silently disappear
        run: node tests/test_tnusrb_source_verification.mjs
      - name: Validate source-numbered Group I 2011 D-series typed quiz and exception-key scoring
        run: node tests/test_tnpsc_g1_2011_typed.mjs
      - name: Validate eight-paper typed PYQ catalogue and real source coverage
        run: node tests/test_typed_pyq_catalog.mjs
      - name: Validate 2024 and 2025 Group IV source-linked typed draft integrity
        run: node tests/test_tnpsc_g4_typed_review.mjs
      - name: Validate Group I 2026 200 user-extracted A–E text questions with no fabricated keys
        run: node tests/test_tnpsc_g1_2026_quiz.mjs
      - name: Validate Group I syllabus-first unit, topic and previous-year-question routing
        run: node tests/test_group1_syllabus_flow.mjs
      - name: Verify commercial navigation and publication trust
        run: python3 -m unittest discover -s tests -p 'test_commercial_readiness.py'
      - name: Test live Current Affairs publishing and source freshness guards
        run: python3 -m unittest discover -s tests -p 'test_current_affairs_publishing_health.py' -v
      - name: Validate TN textbook topic quiz and bilingual coverage
        run: node tests/test_textbook_topic_quiz.mjs
      - name: Reconcile new 2024 Group IV questions with official final key
        run: node tests/test_tnpsc_g4_2024_final_key.mjs
      - name: Validate 200 extracted original-number JSON records without false verification
        run: node tests/test_tnpsc_g4_2024_source_json.mjs
      - name: Validate full bilingual Group IIA notes
        run: node tests/test_group2a_text_notes.mjs
      - name: Enforce full original-paper license, completeness, sequence and final-key gate
        run: node tests/test_pyq_original_full_gate.mjs
      - name: Validate original full-paper PDF companion without transcription claims
        run: node tests/test_pyq_original_paper.mjs
      - name: Validate local original-PYQ verbatim digitization workbench
        run: node tests/test_pyq_digitize_workbench.mjs
      - name: Validate year-wise PYQ routing
        run: node tests/test_pyq_yearwise.mjs
      - name: Audit source-attributed PYQ coverage
        run: python3 scripts/audit_pyq_year_coverage.py
      - name: Check scheduled board review policy
        run: python3 scripts/audit_calendar_freshness.py
