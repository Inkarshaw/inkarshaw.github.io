name: ClearExams content trust and user experience checks

on:
  pull_request:
    paths:
      - "pyq-hub.html"
      - "pyq-original-paper.html"
      - "pyq-original-digital.html"
      - "data/quizzes/verified-full-original-papers.json"
      - "tests/test_pyq_original_full_gate.mjs"
      - "pyq-full-quiz.html"
      - "data/quizzes/original-paper-practice.json"
      - "tests/test_pyq_original_paper.mjs"
      - "daily-quiz.html"
      - "textbook-play.html"
      - "textbook-topics.html"
      - "textbook-quiz.html"
      - "data/textbook/class-12/history/index.json"
      - "data/textbook/class-12/history/unit-1.json"
      - "tests/test_textbook_topic_quiz.mjs"
      - "tn-school-notes.html"
      - "dashboard.html"
      - "exam-calendar.html"
      - "assets/js/notes-quality.js"
      - "assets/js/calendar-freshness.js"
      - "assets/js/progress-transfer.js"
      - "data/exams/review-schedule.json"
      - "data/quizzes/verified-pyqs.json"
      - "tests/test_content_trust.mjs"
      - "tests/test_tnpsc_g4_2024_final_key.mjs"
      - "assets/js/tn-school-notes-data.js"
      - "scripts/audit_pyq_year_coverage.py"
  push:
    branches: [main]
    paths:
      - "pyq-hub.html"
      - "pyq-original-paper.html"
      - "pyq-original-digital.html"
      - "data/quizzes/verified-full-original-papers.json"
      - "tests/test_pyq_original_full_gate.mjs"
      - "pyq-full-quiz.html"
      - "data/quizzes/original-paper-practice.json"
      - "tests/test_pyq_original_paper.mjs"
      - "daily-quiz.html"
      - "textbook-play.html"
      - "textbook-topics.html"
      - "textbook-quiz.html"
      - "data/textbook/class-12/history/index.json"
      - "data/textbook/class-12/history/unit-1.json"
      - "tests/test_textbook_topic_quiz.mjs"
      - "tn-school-notes.html"
      - "dashboard.html"
      - "exam-calendar.html"
      - "assets/js/**"
      - "data/exams/review-schedule.json"
      - "data/quizzes/verified-pyqs.json"
      - "tests/test_content_trust.mjs"
      - "tests/test_tnpsc_g4_2024_final_key.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test content quality and user interactions
        run: node tests/test_content_trust.mjs
      - name: Validate TN textbook topic quiz and bilingual coverage
        run: node tests/test_textbook_topic_quiz.mjs
      - name: Reconcile new 2024 Group IV questions with official final key
        run: node tests/test_tnpsc_g4_2024_final_key.mjs
      - name: Validate full bilingual Group IIA notes
        run: node tests/test_group2a_text_notes.mjs
      - name: Enforce full original-paper license, completeness, sequence and final-key gate
        run: node tests/test_pyq_original_full_gate.mjs
      - name: Validate original full-paper PDF companion without transcription claims
        run: node tests/test_pyq_original_paper.mjs
      - name: Validate year-wise PYQ routing
        run: node tests/test_pyq_yearwise.mjs
      - name: Audit source-attributed PYQ coverage
        run: python3 scripts/audit_pyq_year_coverage.py
      - name: Check scheduled board review policy
        run: python3 scripts/audit_calendar_freshness.py
