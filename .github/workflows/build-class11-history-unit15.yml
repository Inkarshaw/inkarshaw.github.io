name: Build Class 11 History Unit 15

on:
  push:
    paths:
      - '.tmp/unit15/build_unit15.py'
      - '.github/workflows/build-class11-history-unit15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unit-15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and publish Unit 15 question bank
        shell: bash
        run: |
          set -euo pipefail
          python .tmp/unit15/build_unit15.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/textbook/class-11/history/unit-15.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Class 11 History Unit 15 bilingual competitive question bank"
          git push
