name: Build daily current affairs PDF

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date in YYYY-MM-DD (defaults to current IST date)"
        required: false
        type: string
  schedule:
    - cron: "40 14 * * *"  # 20:10 IST

permissions:
  contents: write

concurrency:
  group: daily-current-affairs-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow reportlab

      - name: Resolve date
        id: d
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE=$(TZ=Asia/Kolkata date +%F)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Build and compress PDF
        run: python scripts/build_daily_current_affairs.py --date "${{ steps.d.outputs.date }}"

      - name: Verify PDF
        shell: bash
        run: |
          DATE="${{ steps.d.outputs.date }}"
          FILE="current-affairs/$DATE.pdf"
          test -s "$FILE"
          head -c 5 "$FILE" | grep -q '%PDF-'
          ls -lh "$FILE"

      - name: Rebuild current affairs PDF list
        run: python3 current-affairs/generate-pdf-list.py

      - name: Commit PDF and updated list
        shell: bash
        run: |
          DATE="${{ steps.d.outputs.date }}"
          FILE="current-affairs/$DATE.pdf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE" current-affairs/pdfs.json
          if git diff --cached --quiet; then
            echo "PDF and list are already up to date."
            exit 0
          fi
          git commit -m "Publish daily current affairs PDF for $DATE"
          git pull --rebase origin main
          git push origin main
