name: Build daily current affairs PDF

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date in YYYY-MM-DD (defaults to current IST date)"
        required: false
        type: string
  schedule:
    - cron: "40 14 * * *"  # 20:10 IST

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow reportlab

      - name: Resolve date
        id: d
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE=$(TZ=Asia/Kolkata date +%F)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Build PDF
        run: python scripts/build_daily_current_affairs.py --date "${{ steps.d.outputs.date }}"

      - name: Commit generated PDF
        shell: bash
        run: |
          DATE="${{ steps.d.outputs.date }}"
          FILE="current-affairs/$DATE.pdf"
          if [ ! -f "$FILE" ]; then
            echo "No PDF generated; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add daily current affairs PDF for $DATE"
          git push
