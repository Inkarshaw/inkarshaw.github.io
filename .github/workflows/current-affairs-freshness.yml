name: Monitor daily current-affairs freshness

on:
  schedule:
    - cron: "55 16 * * *" # 22:25 IST, after the planned evening edition
  workflow_dispatch:
  push:
    paths:
      - current-affairs/text/editions.json
      - 'current-affairs/text/data/**'
      - current-affairs/text/build_text_editions.py

permissions:
  contents: read
  issues: write

jobs:
  verify-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the source-backed catalog before monitoring
        run: python3 current-affairs/text/build_text_editions.py
      - name: Evaluate editorial freshness and live publication in India
        id: freshness
        run: python3 scripts/check_current_affairs_freshness.py --retries 3 --pause 5
      - name: Open or resolve a freshness issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STALE: ${{ steps.freshness.outputs.stale }}
          LATEST: ${{ steps.freshness.outputs.source_latest }}
          LIVE_LATEST: ${{ steps.freshness.outputs.live_latest }}
          REASON: ${{ steps.freshness.outputs.reason }}
          AGE: ${{ steps.freshness.outputs.age }}
        shell: bash
        run: |
          set -euo pipefail
          title="ClearExams current-affairs publication overdue"
          issue=$(gh issue list --state open --search "in:title ClearExams current-affairs publication overdue" --json title,number --jq '.[] | select(.title=="ClearExams current-affairs publication overdue") | .number' | head -n 1)
          if [ "$STALE" = "true" ]; then
            if [ -z "$issue" ]; then
              gh issue create --title "$title" --body "The source-backed text edition catalog has not received a recent edition. Newest vetted source: $LATEST ($AGE days old); newest live edition: $LIVE_LATEST; check: $REASON. Check editorial approval, the daily publisher, website queue, and GitHub Pages deployment. Do not publish unverified or fabricated stories just to clear this alert."
            else
              echo "Existing issue #$issue remains open. Source: $LATEST; live: $LIVE_LATEST; reason: $REASON." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "The vetted edition and deployed article are current (source: $LATEST, live: $LIVE_LATEST). Closing the automated freshness incident."
          fi
