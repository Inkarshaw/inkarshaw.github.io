<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">2010 SI Q106: labelled Venn diagram</title><desc id="desc">Triangle denotes school teachers, square married people, circle joint families. E is in circle only, F triangle only, C square and triangle, A square only, B square circle and triangle, D indicated by arrow inside square and circle but outside triangle.</desc><rect width="640" height="320" fill="#fff"/><g fill="none" stroke="#111" stroke-width="2"><circle cx="215" cy="155" r="96"/><rect x="225" y="104" width="190" height="188"/><path d="M331 14 L455 184 H270 Z"/></g><g fill="#111" font-family="Georgia,serif" font-size="24"><text x="163" y="131">E</text><text x="345" y="92">F</text><text x="363" y="157">C</text><text x="317" y="253">A</text><text x="253" y="188">B</text><text x="160" y="302">D</text></g><path d="M178 286 L250 220" stroke="#111" stroke-width="2" fill="none"/><path d="M250 220 l-10 3 l9 9 z" fill="#111"/><text x="465" y="101" fill="#555" font-family="Arial,sans-serif" font-size="15">Triangle: teachers</text><text x="465" y="126" fill="#555" font-family="Arial,sans-serif" font-size="15">Square: married</text><text x="465" y="151" fill="#555" font-family="Arial,sans-serif" font-size="15">Circle: joint family</text><text x="465" y="209" fill="#666" font-family="Arial,sans-serif" font-size="13">Diagram redrawn</text><text x="465" y="227" fill="#666" font-family="Arial,sans-serif" font-size="13">from archive p14</text></svg>