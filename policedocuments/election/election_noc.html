<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Election NOC / Permission Document Generator</title>
    <!-- html2pdf.js for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f5;
            font-family: 'Bamini', 'Tamil Bamini', 'Latha', 'Tamil MN', 'Mangal', 'Noto Sans Tamil', 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
        }

        /* Main container - no outer border */
        .app-container {
            max-width: 1500px;
            margin: 0 auto;
            background: #ffffff;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* Form panel */
        .form-panel {
            flex: 1.2;
            min-width: 340px;
            background: #ffffff;
            border-right: 1px solid #000000;
            padding: 24px 22px;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* Preview panel */
        .preview-panel {
            flex: 1.8;
            min-width: 540px;
            background: #ffffff;
            padding: 24px 28px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #000000;
            border-left: 3px solid #000000;
            padding-left: 16px;
            margin-bottom: 20px;
            font-family: 'Bamini', 'Tamil Bamini', 'Latha', serif;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            font-weight: 700;
            color: #000000;
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
            font-family: 'Bamini', 'Tamil Bamini', 'Latha', serif;
        }

        input, textarea, select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #000000;
            border-radius: 0px;
            background: #ffffff;
            font-family: 'Bamini', 'Tamil Bamini', 'Latha', 'Segoe UI', monospace;
            font-size: 0.85rem;
            transition: 0.2s;
            color: #000000;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #000000;
            box-shadow: none;
        }

        textarea {
            resize: vertical;
            min-height: 65px;
        }

        .row-2col {
            display: flex;
            gap: 14px;
        }
        .row-2col > div {
            flex: 1;
        }

        button {
            background: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            padding: 11px 16px;
            border-radius: 0px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
            font-family: 'Bamini', 'Tamil Bamini', 'Latha', serif;
        }
        button:hover {
            background: #f0f0f0;
            transform: translateY(-1px);
        }
        .btn-reset {
            background: #ffffff;
            border: 1px solid #000000;
        }
        .btn-reset:hover {
            background: #f0f0f0;
        }

        /* ========= PDF DOCUMENT STYLES - FULL BAMINI FONT ========= */
        .pdf-doc {
            background: #ffffff;
            overflow: hidden;
            box-shadow: none;
        }
        
        .document-inner {
            padding: 28px 28px 22px 28px;
            font-family: 'Bamini', 'Tamil Bamini', 'Latha', 'Tamil MN', 'Noto Sans Tamil', serif;
            font-size: 12.5px;
            line-height: 1.45;
            color: #000000;
            background: #ffffff;
        }
        
        /* Top center header - காவல் துறை in Bamini */
        .top-center-header {
            text-align: center;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #000000;
            font-family: 'Bamini', 'Tamil Bamini', 'Latha', serif;
        }
        
        /* Header table - black borders only - single row */
        .election-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 14px;
            font-size: 12px;
        }
        .election-table td {
            border: 1px solid #000000;
            padding: 6px 8px;
            vertical-align: top;
        }
        .table-label {
            background-color: #ffffff;
            font-weight: 700;
            width: 42%;
        }
        
        .ref-line {
            font-weight: 600;
            margin: 4px 0 3px;
            font-size: 12px;
            font-family: 'Bamini', 'Tamil Bamini', 'Latha', serif;
        }
        .recipient-line {
            margin: 5px 0 8px;
            font-size: 12px;
            font-family: 'Bamini', 'Tamil Bamini', 'Latha', serif;
        }
        .subject-card {
            background: #ffffff;
            padding: 8px 12px;
            border-left: 3px solid #000000;
            margin: 12px 0 10px;
            border-radius: 0px;
            font-size: 12px;
            border-top: 1px solid #000000;
            border-right: 1px solid #000000;
            border-bottom: 1px solid #000000;
            font-family: 'Bamini', 'Tamil Bamini', 'Latha', serif;
        }
        .main-body-text {
            text-align: justify;
            margin: 10px 0;
            font-size: 12px;
            line-height: 1.45;
            font-family: 'Bamini', 'Tamil Bamini', 'Latha', serif;
        }
        .legal-note {
            margin: 12px 0 12px 0;
            border-left: 3px solid #000000;
            padding-left: 12px;
            font-size: 11.5px;
            line-height: 1.4;
            font-family: 'Bamini', 'Tamil Bamini', 'Latha', serif;
        }
        
        /* Single cell table for footer */
        .footer-single-table {
            border-collapse: collapse;
            margin-top: 20px;
            margin-left: auto;
            margin-right: 0;
            width: auto;
            min-width: 180px;
            max-width: 250px;
        }
        .footer-single-table td {
            border: 1px solid #000000;
            padding: 8px 12px;
            text-align: center;
            vertical-align: middle;
            font-family: 'Bamini', 'Tamil Bamini', 'Latha', serif;
            font-size: 11px;
            line-height: 1.5;
            background: #ffffff;
        }
        
        @media (max-width: 600px) {
            .footer-single-table td {
                white-space: normal;
            }
        }
        
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .bamini-badge {
            background: #ffffff;
            color: #000000;
            padding: 4px 14px;
            border-radius: 0px;
            font-size: 12px;
            font-weight: 500;
            font-family: monospace;
            border: 1px solid #000000;
        }
        
        @media (max-width: 850px) {
            .app-container {
                flex-direction: column;
            }
            .form-panel {
                border-right: none;
                border-bottom: 1px solid #000000;
                max-height: none;
            }
            .document-inner {
                padding: 20px;
            }
            .footer-single-table {
                margin-left: auto;
                margin-right: 0;
            }
        }
        
        /* Embedded font-face for Bamini */
        @font-face {
            font-family: 'Bamini';
            src: local('Bamini'), local('Tamil Bamini'), local('Bamini Tamil');
            font-weight: normal;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Tamil Bamini';
            src: local('Bamini'), local('Tamil Bamini');
            font-weight: normal;
            font-style: normal;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- LEFT: EDITABLE FORM -->
    <div class="form-panel">
        <h2>📄 தேர்தல் NOC / Election NOC Generator</h2>
        <p style="font-size: 0.82rem; margin: -10px 0 16px; color:#444;">Reusable neutral template — enter the applicant, event and location details for the current request.</p>
        <form id="docForm">
            <div class="row-2col">
                <div class="form-group">
                    <label>C.No / Reference</label>
                    <input type="text" id="refNo" placeholder="e.g. C.No.___/Election/____/20__">
                </div>
                <div class="form-group">
                    <label>Document Date</label>
                    <input type="text" id="docDate" placeholder="DD.MM.YYYY">
                </div>
            </div>
            <div class="row-2col">
                <div class="form-group">
                    <label>Application Ref No</label>
                    <input type="text" id="appRefNo" placeholder="Application / petition reference">
                </div>
                <div class="form-group">
                    <label>To (Recipient / Office) - பெறுநர்</label>
                    <input type="text" id="recipientAddr" placeholder="Recipient designation / office">
                </div>
            </div>

            <div class="form-group">
                <label>Applicant / Organisation / Candidate</label>
                <input type="text" id="applicantName" placeholder="Name of applicant / organisation / candidate">
            </div>
            <div class="form-group">
                <label>Event / Programme</label>
                <input type="text" id="eventName" placeholder="Meeting / campaign / procession / other programme">
            </div>
            <div class="row-2col">
                <div class="form-group">
                    <label>Event Date</label>
                    <input type="text" id="eventDate" placeholder="DD.MM.YYYY">
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <input type="text" id="eventTime" placeholder="e.g. 09:00 AM to 01:00 PM">
                </div>
            </div>
            <div class="row-2col">
                <div class="form-group">
                    <label>Place / Route</label>
                    <input type="text" id="eventPlace" placeholder="Venue / route / locality">
                </div>
                <div class="form-group">
                    <label>Expected Participants</label>
                    <input type="text" id="participants" placeholder="Approximate number">
                </div>
            </div>

            <div class="form-group">
                <label>Subject Line - பொருள்</label>
                <textarea id="subjectText" rows="2" placeholder="Enter the subject of the NOC / permission request"></textarea>
            </div>
            <div class="form-group">
                <label>Main Content (optional custom text) - முக்கிய உள்ளடக்கம்</label>
                <textarea id="mainContent" rows="5" placeholder="Leave blank to use the neutral body generated from the fields above, or enter your own approved wording."></textarea>
            </div>
            <div class="form-group">
                <label>Conditions / Footer Note - நிபந்தனைகள்</label>
                <textarea id="footerNote" rows="3" placeholder="Enter applicable conditions / official note."></textarea>
            </div>
            <button type="button" id="generatePdfBtn">📄 Generate PDF</button>
            <button type="button" id="resetBtn" class="btn-reset">⟳ Clear Form</button>
        </form>
    </div>

    <div class="preview-panel">
        <div class="preview-header">
            <h2>📄 Document Preview</h2>
            <span class="bamini-badge">Election NOC / Permission</span>
        </div>
        <div id="pdfPreviewContainer">
            <div id="livePreview" class="pdf-doc">
                <div class="document-inner" id="dynamicInner"></div>
            </div>
        </div>
        <p style="margin-top: 14px; font-size: 11px; text-align: center; background:#ffffff; padding: 6px; border: 1px solid #000000;">Review all names, dates, conditions and legal requirements before issuing the document.</p>
    </div>
</div>

<script>
    // DOM elements
    const refNoInput = document.getElementById('refNo');
    const docDateInput = document.getElementById('docDate');
    const appRefNoInput = document.getElementById('appRefNo');
    const recipientAddrInput = document.getElementById('recipientAddr');
    const applicantNameInput = document.getElementById('applicantName');
    const eventNameInput = document.getElementById('eventName');
    const eventDateInput = document.getElementById('eventDate');
    const eventTimeInput = document.getElementById('eventTime');
    const eventPlaceInput = document.getElementById('eventPlace');
    const participantsInput = document.getElementById('participants');
    const subjectTextarea = document.getElementById('subjectText');
    const mainContentTextarea = document.getElementById('mainContent');
    const footerNoteTextarea = document.getElementById('footerNote');
    const dynamicInner = document.getElementById('dynamicInner');
    
    const fromOfficeText = "அனுப்புநர்;<br>காவல் ஆய்வாளர்.";
    
    function buildFullBaminiDocumentHTML() {
        const refNo = refNoInput.value.trim() || "[C.No / Reference]";
        const docDate = docDateInput.value.trim() || "[Document Date]";
        const appRefNo = appRefNoInput.value.trim() || "[Application Ref No]";
        const recipient = recipientAddrInput.value.trim() || "[Recipient / Office]";
        const applicant = applicantNameInput.value.trim() || "[Applicant / Organisation / Candidate]";
        const eventName = eventNameInput.value.trim() || "[Event / Programme]";
        const eventDate = eventDateInput.value.trim() || "[Event Date]";
        const eventTime = eventTimeInput.value.trim() || "[Time]";
        const eventPlace = eventPlaceInput.value.trim() || "[Place / Route]";
        const participants = participantsInput.value.trim() || "[Expected Participants]";
        const subject = subjectTextarea.value.trim() || "பொருள்: தேர்தல் தொடர்பான நிகழ்ச்சி / திட்டத்திற்கு தடையின்மை / அனுமதி கோருதல் - தொடர்பாக.";
        let mainContent = mainContentTextarea.value.trim();
        if (!mainContent) {
            mainContent = `${applicant} சார்பில் ${eventName} தொடர்பாக ${eventDate} அன்று ${eventTime} நேரத்தில் ${eventPlace} பகுதியில் நிகழ்ச்சி நடத்த அனுமதி / தடையின்மை கோரி விண்ணப்பம் அளிக்கப்பட்டுள்ளது. எதிர்பார்க்கப்படும் பங்கேற்பாளர்கள்: ${participants}. விண்ணப்பத்தில் குறிப்பிடப்பட்ட விவரங்கள் மற்றும் நடைமுறையில் உள்ள விதிமுறைகள் / நிபந்தனைகளின் அடிப்படையில் பரிசீலிக்கப்படுகிறது.`;
        }
        const footerNote = footerNoteTextarea.value.trim() || "இவ்வாவணம் சம்பந்தப்பட்ட அதிகாரியின் இறுதி பரிசீலனைக்கும், அப்போது நடைமுறையில் உள்ள சட்டம், தேர்தல் வழிமுறைகள், காவல் துறை நிபந்தனைகள் மற்றும் பிற பொருந்தும் கட்டுப்பாடுகளுக்கும் உட்பட்டது.";
        
        return `
            <div style="font-family: 'Bamini', 'Tamil Bamini', 'Latha', 'Tamil MN', 'Noto Sans Tamil', serif; color: #000000;">
                <!-- TOP CENTER HEADER: காவல் துறை in Bamini -->
                <div class="top-center-header" style="text-align: center; font-weight: 700; font-size: 16px; letter-spacing: 1px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #000000;">
                    காவல் துறை
                </div>
                
                <!-- Header Table - SINGLE ROW ONLY -->
                <table class="election-table" style="width:100%; border-collapse: collapse; font-family: 'Bamini', 'Tamil Bamini', 'Latha', serif;">
                    <tr>
                        <td class="table-label" style="border:1px solid #000000; padding:5px 7px; background:#ffffff; font-weight:bold;">
                            ${fromOfficeText}
                        </td>
                        <td style="border:1px solid #000000; padding:5px 7px; background:#ffffff;">
                            பெறுநர்;<br>${recipient}
                        </td>
                    </tr>
                </table>
                
                <!-- Reference lines - English numbers preserved -->
                <div class="ref-line"><strong>${refNo}</strong>, நாள்: ${docDate}</div>
                <div class="ref-line" style="margin-bottom: 8px;"><strong>குறிப்பு எண்.${appRefNo}</strong></div>
                
                <div class="subject-card">
                    <strong>பொருள் / Subject:</strong><br> ${subject}
                </div>
                
                <div class="main-body-text">
                    ${mainContent}
                </div>
                
                <div class="legal-note">
                    ${footerNote}
                </div>
                
                <!-- SINGLE CELL TABLE - FOOTER WITH BAMINI TEXT -->
                <table class="footer-single-table" style="border-collapse: collapse; margin-top: 20px; margin-left: auto; margin-right: 0; width: auto; min-width: 180px; max-width: 250px;">
                    <tr>
                        <td style="border: 1px solid #000000; padding: 8px 12px; text-align: center; vertical-align: middle; font-family: 'Bamini', 'Tamil Bamini', 'Latha', serif; font-size: 11px; line-height: 1.5; background: #ffffff;">
                            காவல் ஆய்வாளர்<br>
                            [Police Station / Unit]<br>
                            [District / City]
                        </td>
                    </tr>
                </table>
            </div>
        `;
    }
    
    function updatePreview() {
        const html = buildFullBaminiDocumentHTML();
        dynamicInner.innerHTML = html;
    }
    
    const allFields = [refNoInput, docDateInput, appRefNoInput, recipientAddrInput, applicantNameInput, eventNameInput, eventDateInput, eventTimeInput, eventPlaceInput, participantsInput, subjectTextarea, mainContentTextarea, footerNoteTextarea];
    allFields.forEach(field => {
        field.addEventListener('input', updatePreview);
        field.addEventListener('change', updatePreview);
    });
    
    function generateBaminiPDF() {
        const previewElement = document.getElementById('livePreview');
        if (!previewElement) return;
        
        const clone = previewElement.cloneNode(true);
        clone.style.margin = "0";
        clone.style.padding = "0";
        clone.style.backgroundColor = "#ffffff";
        clone.style.border = "none";
        
        const innerDiv = clone.querySelector('.document-inner');
        if (innerDiv) {
            innerDiv.style.padding = "0.35in 0.35in 0.28in 0.35in";
            innerDiv.style.fontFamily = "'Bamini', 'Tamil Bamini', 'Latha', 'Tamil MN', 'Noto Sans Tamil', serif";
            innerDiv.style.backgroundColor = "#ffffff";
            innerDiv.style.color = "#000000";
        }
        
        const pdfDocDiv = clone.querySelector('.pdf-doc');
        if (pdfDocDiv) {
            pdfDocDiv.style.border = "none";
        }
        
        const allElements = clone.querySelectorAll('*');
        allElements.forEach(el => {
            el.style.backgroundColor = "#ffffff";
            el.style.color = "#000000";
            const currentFont = window.getComputedStyle(el).fontFamily;
            if (!currentFont.includes('Bamini') && !currentFont.includes('Tamil')) {
                el.style.fontFamily = "'Bamini', 'Tamil Bamini', 'Latha', 'Tamil MN', 'Noto Sans Tamil', serif";
            }
        });
        
        const wrapper = document.createElement('div');
        wrapper.style.background = "#ffffff";
        wrapper.style.width = "100%";
        wrapper.appendChild(clone);
        document.body.appendChild(wrapper);
        
        const pdfOptions = {
            margin:        [0.4, 0.45, 0.35, 0.45],
            filename:     `Election_NOC_${(docDateInput.value || 'draft').replace(/[\\/]/g, '-')}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { 
                scale: 2.2, 
                letterRendering: true, 
                logging: false,
                useCORS: false,
                backgroundColor: "#ffffff"
            },
            jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait', compress: true }
        };
        
        html2pdf().set(pdfOptions).from(wrapper).save().then(() => {
            document.body.removeChild(wrapper);
        }).catch(err => {
            console.error("PDF generation error:", err);
            document.body.removeChild(wrapper);
            alert("PDF generation failed. Please ensure your system supports Tamil Bamini font.");
        });
    }
    
    function resetToOriginal() {
        refNoInput.value = "";
        docDateInput.value = "";
        appRefNoInput.value = "";
        recipientAddrInput.value = "";
        applicantNameInput.value = "";
        eventNameInput.value = "";
        eventDateInput.value = "";
        eventTimeInput.value = "";
        eventPlaceInput.value = "";
        participantsInput.value = "";
        subjectTextarea.value = "";
        mainContentTextarea.value = "";
        footerNoteTextarea.value = "";
        updatePreview();
    }
    
    const generateBtn = document.getElementById('generatePdfBtn');
    generateBtn.addEventListener('click', (e) => {
        e.preventDefault();
        generateBaminiPDF();
    });
    
    const resetButton = document.getElementById('resetBtn');
    resetButton.addEventListener('click', (e) => {
        e.preventDefault();
        resetToOriginal();
    });
    
    updatePreview();
</script>
</body>
</html>
