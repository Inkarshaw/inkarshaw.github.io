<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#071c33">
<title>My Cases | ClearExams</title>
<style>
:root{--navy:#071c33;--blue:#1463ff;--bg:#f4f7fb;--ink:#10233b;--muted:#68798d;--line:#dce5ef;--white:#fff;--red:#b43b3b;--green:#16845d;--shadow:0 10px 30px rgba(7,28,51,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}.top .wrap{min-height:64px;display:flex;align-items:center;gap:12px}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-weight:650}.cloud{margin-left:auto;display:flex;align-items:center;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:42px;padding:9px 13px;font-weight:800;color:#29425e;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.active{background:#eef4ff;border-color:#aac4ff}.hero{background:linear-gradient(135deg,#071c33,#0c3d69);color:#fff;padding:25px 0}.hero h1{margin:0 0 5px;font-size:clamp(2rem,5vw,3rem)}.hero p{margin:0;color:#c7d6e7}.main{padding:18px 0 60px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat strong{display:block;font-size:1.55rem}.stat span{color:var(--muted);font-size:.78rem}.syncline{font-size:.76rem;color:var(--muted);margin:-4px 0 14px}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 180px auto auto;gap:8px;margin-bottom:14px}.input,.select{width:100%;min-height:44px;border:1px solid #cbd7e4;border-radius:10px;background:#fff;padding:9px 11px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-head h2{margin:0;font-size:1.05rem}.case-list{display:grid}.case-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:15px 16px;border-bottom:1px solid #edf2f7}.case-card:last-child{border-bottom:0}.case-title{font-weight:900}.case-meta,.case-sub{margin-top:5px;color:var(--muted);font-size:.8rem}.case-actions{display:grid;grid-template-columns:repeat(2,minmax(80px,1fr));gap:6px;align-self:center}.case-actions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-weight:750;cursor:pointer}.case-actions .danger{color:var(--red);border-color:#e7bdbd}.empty{padding:34px;text-align:center;color:var(--muted)}.view-panel{position:fixed;inset:0;background:rgba(5,19,34,.45);z-index:80;display:none;overflow:auto;padding:18px}.view-panel.open{display:block}.view-sheet{width:min(900px,100%);margin:auto;background:#fff;border-radius:16px;overflow:hidden}.view-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:2}.view-head h2{margin:0;flex:1}.view-body{padding:16px}.view-section{margin-bottom:16px}.view-section h3{margin:0 0 9px}.kv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kv,.read-card{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfdff}.kv span{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;font-weight:800}.kv strong{display:block;margin-top:3px;white-space:pre-wrap}.read-card{margin-bottom:7px}.read-card span,.read-card small,.muted{color:var(--muted)}pre{white-space:pre-wrap;overflow:auto;background:#f7f9fc;padding:10px;border-radius:10px}.login{position:fixed;inset:0;background:rgba(5,19,34,.5);z-index:90;display:none;place-items:center;padding:18px}.login.open{display:grid}.login-card{width:min(420px,100%);background:#fff;border-radius:15px;padding:18px}.login-card h3{margin-top:0}.login-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#071c33;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:120}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar .primary{grid-column:1/-1}.case-card{grid-template-columns:1fr}.case-actions{grid-template-columns:repeat(4,1fr)}.kv-grid{grid-template-columns:1fr}.cloud span{display:none}}
@media(max-width:460px){.case-actions{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
<script defer src="/mycases/core.js?v=2"></script>
<script defer src="/mycases/dashboard.js?v=2"></script>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">My Cases<small>ClearExams Police Tools</small></div><div class="cloud"><span id="cloudState">Local only</span><button class="btn" id="cloudBtn">Cloud Login</button></div></div></header>
<section class="hero"><div class="wrap"><h1>My Cases</h1><p>Dashboard, read-only case view, separate editor, local-first cloud sync.</p></div></section>
<main class="main"><div class="wrap">
<div class="stats"><div class="stat"><strong id="statTotal">0</strong><span>Total Cases</span></div><div class="stat"><strong id="statActive">0</strong><span>Active</span></div><div class="stat"><strong id="statUpcoming">0</strong><span>Hearings ≤ 7 Days</span></div><div class="stat"><strong id="statOverdue">0</strong><span>Overdue</span></div><div class="stat"><strong id="statDeleted">0</strong><span>Deleted</span></div></div>
<div class="syncline">Pending sync: <strong id="pendingSync">0</strong> · Last sync: <span id="lastSync">Never</span></div>
<div class="toolbar"><input class="input" id="search" type="search" placeholder="Search crime no., accused, sections, court…"><select class="select" id="stageFilter"><option value="">All Stages</option></select><button class="btn" id="deletedBtn">Deleted Cases</button><button class="btn primary" id="newCaseBtn">＋ New Case</button></div>
<section class="panel"><div class="panel-head"><h2 id="listTitle">Cases</h2></div><div class="case-list" id="caseList"></div></section>
</div></main>
<div class="view-panel" id="viewPanel"><div class="view-sheet"><div class="view-head"><h2 id="viewTitle">Case Details</h2><button class="btn" id="closeView">Close</button></div><div class="view-body" id="viewBody"></div></div></div>
<div class="login" id="loginDialog"><div class="login-card"><h3>My Cases Cloud Login</h3><input class="input" id="cloudPassword" type="password" autocomplete="current-password" placeholder="Private password"><div class="login-actions"><button class="btn" id="loginCancel">Cancel</button><button class="btn primary" id="loginSubmit">Login</button></div></div></div>
<div class="toast" id="toast"></div>
</body></html>
