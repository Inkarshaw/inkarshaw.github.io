      {id:'ssc-cgl',name:'SSC CGL',type:'National',source:'SSC official CGL syllabus',official:'https://ssc.gov.in/api/attachment/uploads/masterData/Syllabus/CGL-syllabus-169635-.pdf',sections:[['Tier I',['General Intelligence and Reasoning','General Awareness','Quantitative Aptitude','English Comprehension']],['Tier II Paper I',['Mathematical Abilities','Reasoning and General Intelligence','English Language and Comprehension','General Awareness','Computer Knowledge and Data Entry Speed Test']],['Post-specific papers',['Statistics for notified statistical posts','General Studies: Finance and Economics for notified audit/accounts posts']]]},
      {id:'banking-exams',name:'Banking Exams',type:'IBPS & SBI',source:'Pattern varies by the current IBPS/SBI notification',official:'https://www.ibps.in/index.php/crp-powt/',sections:[['Prelims',['English Language','Quantitative Aptitude / Numerical Ability','Reasoning Ability']],['Mains',['Reasoning and Computer Aptitude','Data Analysis and Interpretation','English Language','General, Economy and Banking Awareness','Descriptive English where prescribed']],['Final selection',['Interview/group exercise for applicable officer posts; always use the current bank notification']]]},
      {id:'rrb-ntpc',name:'RRB NTPC',type:'Railways',source:'RRB official notifications page',official:'https://www.rrbbbs.gov.in/notifications.php',sections:[['CBT I and CBT II',['Mathematics','General Intelligence and Reasoning','General Awareness']],['Post-specific stages',['Typing Skill Test for applicable clerical posts','Computer Based Aptitude Test for Station Master','Document Verification and Medical Examination']]]}
    ];
    const categories = [
      {name:'UPSC Examinations',ids:['upsc-civil-services']},
      {name:'Tamil Nadu Government Examinations',ids:['tnpsc-group-1','tnpsc-group-2-2a','tnpsc-group-4','tnusrb-si','tnusrb-police-constable']},
      {name:'Teaching Examinations',ids:['tntet','pg-trb']},
      {name:'Staff Selection Commission',ids:['ssc-chsl','ssc-cgl']},
      {name:'Railway Examinations',ids:['rrb-je','rrb-ntpc']},
      {name:'Engineering & Medical Entrance Examinations',ids:['jee-main','neet-ug']},
      {name:'Banking Examinations',ids:['banking-exams']}
    ];
    const grid=document.getElementById('examGrid'),detail=document.getElementById('detail');
    categories.forEach(category=>{const section=document.createElement('section');section.className='exam-group';section.innerHTML=`<h2 class="group-title">${category.name}</h2><div class="exam-grid"></div>`;const categoryGrid=section.querySelector('.exam-grid');category.ids.forEach(id=>{const exam=exams.find(item=>item.id===id);if(!exam)return;const b=document.createElement('button');b.className='exam-button';b.type='button';b.dataset.id=exam.id;b.innerHTML=`<strong>${exam.name}</strong><small>${exam.type}</small>`;b.onclick=()=>showExam(exam,b);categoryGrid.appendChild(b)});grid.appendChild(section)});
    const examSearch=document.getElementById('examSearch'),categoryFilters=document.getElementById('categoryFilters'),examCount=document.getElementById('examCount');let activeCategory='All';
    ['All',...categories.map(c=>c.name)].forEach(name=>{const b=document.createElement('button');b.type='button';b.className='category-filter';b.textContent=name;b.setAttribute('aria-pressed',String(name===activeCategory));b.addEventListener('click',()=>{activeCategory=name;applyExamFilters()});categoryFilters.appendChild(b)});
    function applyExamFilters(){const q=examSearch.value.trim().toLocaleLowerCase();let count=0;document.querySelectorAll('.exam-group').forEach((group,index)=>{const category=categories[index];let visible=0;group.querySelectorAll('.exam-button').forEach(button=>{const exam=exams.find(e=>e.id===button.dataset.id);const match=(activeCategory==='All'||activeCategory===category.name)&&(!q||(exam.name+' '+exam.type+' '+category.name).toLocaleLowerCase().includes(q));button.hidden=!match;if(match){visible++;count++}});group.hidden=!visible});categoryFilters.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===activeCategory)));examCount.textContent=count?count+' examinations available':'No matching examinations. Try another search.'}
    examSearch.addEventListener('input',applyExamFilters);applyExamFilters();
    function addSectionControls(){const sections=[...detail.querySelectorAll('details.section')];if(!sections.length)return;const bar=document.createElement('div');bar.className='detail-actions';[['Expand all',true],['Collapse all',false]].forEach(([label,open])=>{const button=document.createElement('button');button.type='button';button.textContent=label;button.addEventListener('click',()=>sections.forEach(section=>section.open=open));bar.appendChild(button)});const first=detail.querySelector('details.section');first.parentNode.insertBefore(bar,first)}
    const escapeText=text=>text.replace(/[&<>]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[char]));
    const PROGRESS_KEY='clearexamsSyllabusProgressV1';
    function readProgress(){try{return JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}')}catch{return{}}}
    function saveProgress(data){localStorage.setItem(PROGRESS_KEY,JSON.stringify(data))}
    function enableSectionProgress(examId){
      const sections=[...detail.querySelectorAll('details.section')];if(!sections.length)return;
      const all=readProgress(),done=new Set(all[examId]||[]);
      const box=document.createElement('div');box.className='progress-box';box.innerHTML='<strong>Syllabus progress</strong><div class="progress-track"><span></span></div><span class="source" data-progress-label></span>';
      const top=detail.querySelector('.detail-top');if(top)top.insertAdjacentElement('afterend',box);
      const update=()=>{const pct=Math.round(done.size/sections.length*100);box.querySelector('.progress-track span').style.width=pct+'%';box.querySelector('[data-progress-label]').textContent=done.size+' / '+sections.length+' units · '+pct+'%';all[examId]=[...done].sort((a,b)=>a-b);saveProgress(all)};
      sections.forEach((section,index)=>{const row=document.createElement('div');row.className='unit-check';const id='progress-'+examId+'-'+index;row.innerHTML='<input type="checkbox" id="'+id+'"><label for="'+id+'">Mark this syllabus unit completed</label>';const input=row.querySelector('input');input.checked=done.has(index);input.addEventListener('change',()=>{input.checked?done.add(index):done.delete(index);update();if(window.gtag)gtag('event','syllabus_progress_change',{exam:examId,unit:index+1,completed:input.checked})});section.appendChild(row)});update()
    }
    const TOPIC_KEY='clearexamsSyllabusTopicsV1';
    function topicData(){try{return JSON.parse(localStorage.getItem(TOPIC_KEY)||'{}')}catch{return {}}}
    function enableTopicProgress(exam){const state=topicData();const completed=new Set(state[exam.id]||[]);const rows=[...detail.querySelectorAll('details.section')];let total=0;rows.forEach((section,sectionIndex)=>{const list=section.querySelector('ul');if(!list)return;list.classList.add('topic-list');const items=[...list.children];const counter=document.createElement('div');counter.className='topic-progress';section.appendChild(counter);items.forEach((item,topicIndex)=>{const key=sectionIndex+':'+topicIndex;total++;item.classList.add('topic-item');const label=document.createElement('label');const input=document.createElement('input');input.type='checkbox';input.checked=completed.has(key);const span=document.createElement('span');span.className='topic-name';span.textContent=item.textContent;label.append(input,span);item.replaceChildren(label);item.classList.toggle('is-done',input.checked);const actions=document.createElement('div');actions.className='topic-actions';const quiz=document.createElement('a');quiz.href='daily-quiz.html';quiz.textContent='Practice quiz →';const search=document.createElement('a');search.href='search.html?q='+encodeURIComponent(span.textContent);search.textContent='Find study material →';actions.append(quiz,search);item.appendChild(actions);input.addEventListener('change',()=>{input.checked?completed.add(key):completed.delete(key);item.classList.toggle('is-done',input.checked);state[exam.id]=[...completed];try{localStorage.setItem(TOPIC_KEY,JSON.stringify(state))}catch{}refresh()})});function refresh(){counter.textContent=items.filter((_,i)=>completed.has(sectionIndex+':'+i)).length+' / '+items.length+' topics completed'}refresh()});const summary=document.createElement('p');summary.className='source';summary.setAttribute('role','status');const box=detail.querySelector('.progress-box');if(box)box.insertAdjacentElement('afterend',summary);const refreshTotal=()=>{summary.textContent=completed.size+' / '+total+' individual topics completed · '+(total?Math.round(completed.size/total*100):0)+'%'};detail.querySelectorAll('.topic-item input').forEach(input=>input.addEventListener('change',refreshTotal));refreshTotal()}
    const STATUS_KEY='clearexamsSyllabusStatusV1';
    function readTopicStatuses(){try{return JSON.parse(localStorage.getItem(STATUS_KEY)||'{}')}catch{return {}}}
    function enableRevisionStatuses(exam){const all=readTopicStatuses(),statuses=all[exam.id]||{};const items=[...detail.querySelectorAll('details.section')].flatMap((section,si)=>[...section.querySelectorAll('.topic-item')].map((item,ti)=>({item,key:si+':'+ti})));if(!items.length)return;const info=document.createElement('p');info.className='topic-help';info.textContent='Set each topic to Not started, Studying, Completed or Revised. Statuses are saved on this device.';const anchor=detail.querySelector('.detail-actions');if(anchor)anchor.insertAdjacentElement('afterend',info);const summary=document.createElement('p');summary.className='source';info.insertAdjacentElement('afterend',summary);function refresh(){const counts={studying:0,completed:0,revised:0};items.forEach(({key})=>{const value=statuses[key];if(counts[value]!==undefined)counts[value]++});summary.textContent='Studying: '+counts.studying+' · Completed: '+counts.completed+' · Revised: '+counts.revised+' · Not started: '+(items.length-counts.studying-counts.completed-counts.revised)}items.forEach(({item,key})=>{const select=document.createElement('select');select.className='topic-status';select.setAttribute('aria-label','Preparation status for '+item.querySelector('.topic-name').textContent);[['','Not started'],['studying','Studying'],['completed','Completed'],['revised','Revised']].forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;select.appendChild(option)});const checkbox=item.querySelector('input[type=checkbox]');select.value=statuses[key]||(checkbox.checked?'completed':'');function decorate(){item.classList.toggle('is-revising',select.value==='studying');item.classList.toggle('is-revised',select.value==='revised')}decorate();select.addEventListener('change',()=>{if(select.value)statuses[key]=select.value;else delete statuses[key];all[exam.id]=statuses;try{localStorage.setItem(STATUS_KEY,JSON.stringify(all))}catch{};const shouldCheck=select.value==='completed'||select.value==='revised';if(checkbox.checked!==shouldCheck){checkbox.checked=shouldCheck;checkbox.dispatchEvent(new Event('change'))}decorate();refresh()});checkbox.addEventListener('change',()=>{if(checkbox.checked&&select.value===''){select.value='completed';statuses[key]='completed'}else if(!checkbox.checked&&(select.value==='completed'||select.value==='revised')){select.value='';delete statuses[key]}all[exam.id]=statuses;try{localStorage.setItem(STATUS_KEY,JSON.stringify(all))}catch{}decorate();refresh()});item.appendChild(select)});refresh()}
    function addRevisionQueue(exam){const panel=document.createElement('section');panel.className='syllabus-plan';panel.innerHTML='<h3>Revision queue</h3><p>Review unfinished topics first, followed by completed topics awaiting revision. This queue uses your saved topic statuses.</p><button type="button">Build my revision queue</button><ol hidden></ol>';const bar=detail.querySelector('.detail-actions');if(!bar)return;bar.insertAdjacentElement('afterend',panel);const button=panel.querySelector('button'),list=panel.querySelector('ol');button.addEventListener('click',()=>{const state=readTopicStatuses()[exam.id]||{},done=new Set(topicData()[exam.id]||[]);const queue=[];detail.querySelectorAll('details.section').forEach((section,si)=>{section.querySelectorAll('.topic-item').forEach((item,ti)=>{const key=si+':'+ti,status=state[key]||(done.has(key)?'completed':'');if(status==='revised')return;const rank=status==='studying'?0:status==='completed'?1:2;queue.push({name:item.querySelector('.topic-name').textContent,rank,status})})});queue.sort((a,b)=>a.rank-b.rank);list.replaceChildren();queue.slice(0,10).forEach(entry=>{const li=document.createElement('li');const strong=document.createElement('strong');strong.textContent=entry.name+' — '+(entry.status||'not started');const link=document.createElement('a');link.href='search.html?q='+encodeURIComponent(entry.name);link.textContent=' Find material →';li.append(strong,link);list.appendChild(li)});if(!queue.length){const li=document.createElement('li');li.textContent='All listed topics are marked revised.';list.appendChild(li)}list.hidden=false;button.textContent='Refresh revision queue'})}
    async function showExam(exam,button){if(exam.id==='tnpsc-group-4'){document.querySelectorAll('.exam-button').forEach(b=>b.classList.toggle('active',b===button));detail.innerHTML='<div class="detail-top"><div><small>Tamil Nadu</small><h2>TNPSC Group IV Syllabus</h2></div><div class="downloads"><a class="download" href="exam-preparation.html?exam=tnpsc-group-4">Posts, qualifications & preparation →</a></div></div><div id="group4FullReader"></div>';detail.hidden=false;history.replaceState(null,'','#tnpsc-group-4');detail.scrollIntoView({behavior:'smooth',block:'start'});await window.mountGroup4Syllabus(detail.querySelector('#group4FullReader'));return;}if(exam.id==='tnpsc-group-2-2a'){document.querySelectorAll('.exam-button').forEach(b=>b.classList.toggle('active',b===button));detail.innerHTML='<div class="detail-top"><div><small>Tamil Nadu · 2025 official scheme</small><h2>Group IIA Services Syllabus</h2><p class="source">Common Group II/IIA prelims · Group IIA-specific mains · Text with TN school-book notes</p></div><div class="downloads"><a class="download" target="_blank" rel="noopener noreferrer" href="https://tnpsc.gov.in/Document/english/GRP2_11_2025_ENGLISH.pdf">↗ TNPSC official PDF</a></div></div><div id="group2aReader"></div>';detail.hidden=false;history.replaceState(null,'','#tnpsc-group-2-2a');detail.scrollIntoView({behavior:'smooth',block:'start'});window.mountGroup2ASyllabus(detail.querySelector('#group2aReader'));return;}document.querySelectorAll('.exam-button').forEach(b=>b.classList.toggle('active',b===button));const links=exam.links||[['Official syllabus / PDF',exam.official]];const fullArea=exam.textFiles?'<h3 class="full-heading">Full Official Syllabus Text</h3><div class="loading" id="fullTextArea">Loading complete syllabus…</div>':'';detail.innerHTML=`<div class="detail-top"><div><small>${exam.type}</small><h2>${exam.name} Syllabus</h2><p class="source">Source: ${exam.source}</p></div><div class="downloads">${links.map(([label,url])=>`<a class="download" href="${url}" target="_blank" rel="noopener">↗ ${label}</a>`).join('')}</div></div>${exam.sections.map(([h,items],index)=>`<details class="section" ${index===0?'open':''}><summary>${h}</summary><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></details>`).join('')}${fullArea}<div class="note"><strong>Important:</strong> Check the latest official notification for marks, eligibility, negative marking and post-specific changes.</div>`;detail.hidden=false;addSectionControls();enableSectionProgress(exam.id);enableTopicProgress(exam);enableRevisionStatuses(exam);addRevisionQueue(exam);detail.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'',`#${exam.id}`);if(exam.textFiles){const area=document.getElementById('fullTextArea');try{const texts=await Promise.all(exam.textFiles.map(async([label,url])=>[label,await fetch(url).then(response=>{if(!response.ok)throw new Error('Unable to load syllabus text');return response.text()})]));if(area)area.outerHTML=texts.map(([label,text],index)=>`<details class="full-syllabus" ${index===0?'open':''}><summary>${label}</summary><pre class="full-text">${escapeText(text)}</pre></details>`).join('')}catch(error){if(area)area.textContent='The full text could not be loaded. Please use the PDF button above.'}}}
    const selected=exams.find(e=>e.id===location.hash.slice(1));if(selected){const button=document.querySelector(`[data-id="${selected.id}"]`);showExam(selected,button)}
  </script>
