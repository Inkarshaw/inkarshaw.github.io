  <style>
    :root{--blue:#173b75;--blue2:#255caa;--ink:#172033;--muted:#667085;--line:#dbe4f0;--soft:#f3f7fc;--white:#fff;--green:#087f5b}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--soft);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
    header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:18px 20px;box-shadow:0 5px 20px #173b7533}
    .nav{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-size:1.3rem;font-weight:800;letter-spacing:.04em}.home{color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:999px;padding:8px 14px;font-weight:700}
    main{max-width:1080px;margin:auto;padding:42px 18px 70px}.hero{text-align:center;margin-bottom:30px}.hero h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1;color:var(--blue);margin:0 0 12px}.hero p{max-width:700px;margin:auto;color:var(--muted);font-size:1.05rem}
    .exam-groups{margin:28px 0}.exam-group{margin:0 0 28px}.group-title{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:1.25rem;margin:0 0 12px}.group-title::after{content:"";height:1px;background:var(--line);flex:1}.exam-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.exam-button{appearance:none;width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px;text-align:left;cursor:pointer;box-shadow:0 5px 16px #173b7510;transition:.2s}.exam-button:hover,.exam-button:focus-visible{transform:translateY(-2px);border-color:var(--blue2);outline:none}.exam-button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.exam-button small{display:block;color:var(--muted);margin-top:4px}.exam-button.active small{color:#dce8ff}.exam-button strong{font-size:1.05rem}
    .detail{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(20px,5vw,38px);box-shadow:0 12px 30px #173b7512}.detail[hidden]{display:none}.detail-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:20px}.detail h2{color:var(--blue);font-size:clamp(1.6rem,4vw,2.2rem);margin:0}.downloads{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.download{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;text-decoration:none;border-radius:999px;padding:11px 18px;font-weight:800}.download:hover{filter:brightness(.92)}.source{color:var(--muted);margin:7px 0 0}.section,.full-syllabus{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:#fbfdff;overflow:hidden}.section summary,.full-syllabus summary{cursor:pointer;color:var(--blue);font-size:1.08rem;font-weight:800;padding:15px 18px}.section summary:hover,.full-syllabus summary:hover{background:#f1f6fc}.section ul{margin:0;padding:0 38px 16px}.section li{margin:7px 0}.full-heading{color:var(--blue);margin:28px 0 8px}.full-text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:18px;border-top:1px solid var(--line);background:#fff;color:#202939;font:inherit;line-height:1.7}.loading{color:var(--muted);padding:15px 0}.note{margin-top:22px;padding:14px 16px;border-left:4px solid #d99b16;background:#fff8e6;color:#6b4b00;border-radius:8px}
    footer{text-align:center;color:var(--muted);padding:24px 16px;border-top:1px solid var(--line);background:#fff}@media(max-width:540px){main{padding-top:30px}.exam-grid{grid-template-columns:1fr 1fr}.exam-button{padding:14px 12px}.detail-top{display:block}.download{margin-top:15px;width:100%;justify-content:center}}
  </style>

      {id:'tntet',name:'TNTET',type:'Teachers Recruitment Board',source:'TRB official TNTET syllabus index',official:'https://www.trb.tn.gov.in/syllabus1.php?language=LG-1&status=Active',sections:[

      ]},
      {id:'neet-ug',name:'NEET-UG',type:'NTA · Medical entrance',source:'NMC/NTA NEET (UG) 2026 official syllabus',official:'https://cdnbbsr.s3waas.gov.in/s37bc1ec1d9c3426357e69acd5bf320061/uploads/2026/01/202601081066816297.pdf',sections:[
        ['Physics',['Physics and Measurement','Kinematics','Laws of Motion','Work, Energy and Power','Rotational Motion','Gravitation','Properties of Solids and Liquids','Thermodynamics','Kinetic Theory of Gases','Oscillations and Waves','Electrostatics','Current Electricity','Magnetic Effects of Current and Magnetism','Electromagnetic Induction and Alternating Currents','Electromagnetic Waves','Optics','Dual Nature of Matter and Radiation','Atoms and Nuclei','Electronic Devices','Experimental Skills']],
        ['Chemistry',['Some Basic Concepts in Chemistry','Atomic Structure','Chemical Bonding and Molecular Structure','Chemical Thermodynamics','Solutions','Equilibrium','Redox Reactions and Electrochemistry','Chemical Kinetics','Classification of Elements and Periodicity','p-Block Elements','d- and f-Block Elements','Coordination Compounds','Purification and Characterisation of Organic Compounds','Basic Principles of Organic Chemistry','Hydrocarbons','Organic compounds containing halogens, oxygen and nitrogen','Biomolecules','Principles Related to Practical Chemistry']],
        ['Biology',['Diversity in Living World','Structural Organisation in Animals and Plants','Cell Structure and Function','Plant Physiology','Human Physiology','Reproduction','Genetics and Evolution','Biology and Human Welfare','Biotechnology and Its Applications','Ecology and Environment']]
      ]},
      {id:'tnpsc-group-1',name:'TNPSC Group I',type:'Tamil Nadu',source:'TNPSC official syllabus codes 497 (Preliminary) and 498 (Main)',links:[['Preliminary PDF','syllabus-pdfs/tnpsc-group-1-preliminary-syllabus.pdf'],['Mains PDF','syllabus-pdfs/tnpsc-group-1-mains-syllabus.pdf']],textFiles:[['Complete Preliminary Syllabus','syllabus-text/tnpsc-group-1-preliminary.txt'],['Complete Mains Syllabus','syllabus-text/tnpsc-group-1-mains.txt']],sections:[['Prelims',['General Science','Geography of India','History and Culture of India','Indian Polity','Indian Economy','Indian National Movement','History, Culture, Heritage and Socio-Political Movements in Tamil Nadu','Development Administration in Tamil Nadu','Aptitude and Mental Ability','Current Events']],['Mains',['Tamil Eligibility Test','GS I: modern history, Indian culture and social issues','GS II: polity, science and technology, Tamil society and geography','GS III: environment, economy, biodiversity, security and disaster management','Interview']]]},
      {id:'tnpsc-group-2-2a',name:'TNPSC Group II & IIA',type:'Tamil Nadu',source:'TNPSC official Group II/IIA syllabus',official:'https://www.tnpsc.gov.in/static_pdf/syllabus/G2_Revised_Scheme_Syllabus_27012022.pdf',sections:[['Prelims',['General Tamil or General English','General Science','Geography','History and Culture of India and Tamil Nadu','Indian Polity','Indian Economy','Indian National Movement','Tamil Nadu development administration','Aptitude and Mental Ability','Current Events']],['Mains',['Tamil Eligibility Test','General Studies descriptive/degree-standard paper under the applicable Group II or IIA scheme','Interview only for interview posts']]]},
      {id:'tnpsc-group-4',name:'TNPSC Group IV',type:'Tamil Nadu',source:'TNPSC official syllabus code 496',links:[['Group IV PDF','syllabus-pdfs/tnpsc-group-4-official-syllabus.pdf']],textFiles:[['Complete Group IV Syllabus','syllabus-text/tnpsc-group-4.txt']],sections:[['Part A',['Tamil Eligibility-cum-Scoring Test: grammar, vocabulary, writing and comprehension, literature and Tamil scholars']],['Part B — General Studies',['General Science','Geography','History, Culture of India and Indian National Movement','Indian Polity','Indian Economy and Development Administration in Tamil Nadu','History, Culture, Heritage and Socio-Political Movements of Tamil Nadu']],['Part C',['Aptitude and Mental Ability: simplification, percentage, HCF/LCM, ratio, interest, area/volume, time/work and reasoning']]]},
      {id:'tnusrb-si',name:'TNUSRB Sub-Inspector',type:'Police recruitment',source:'TNUSRB official SI syllabus',official:'https://www.tnusrb.tn.gov.in/si_exam_syllabus.pdf',sections:[['Tamil Eligibility Test',['Tamil grammar, vocabulary, literature and comprehension under the official standard']],['Open candidates',['General Knowledge: science, history, geography, economics, polity and current affairs','Psychology: logical analysis, numerical analysis, communication skills, information handling and mental ability']],['Departmental candidates',['General Knowledge and Psychology','Police Standing Orders and Police Administration']],['Other stages',['Certificate verification and physical tests','Viva voce and special marks as notified']]]},
      {id:'tnusrb-police-constable',name:'TNUSRB Police Constable',type:'Police recruitment',source:'TNUSRB official common-recruitment page',official:'https://www.tnusrb.tn.gov.in/commonrecruitment-tnusrb.php',sections:[['Tamil Eligibility Test',['Tamil grammar, vocabulary, literature and comprehension']],['Main Written Examination',['General Knowledge: science, history, geography, economics, polity and current events','Psychology: logical analysis, numerical ability, communication and information handling']],['Other stages',['Certificate verification and physical measurement','Endurance and physical-efficiency tests','Special marks where notified']]]},
      {id:'ssc-cgl',name:'SSC CGL',type:'National',source:'SSC official CGL syllabus',official:'https://ssc.gov.in/api/attachment/uploads/masterData/Syllabus/CGL-syllabus-169635-.pdf',sections:[['Tier I',['General Intelligence and Reasoning','General Awareness','Quantitative Aptitude','English Comprehension']],['Tier II Paper I',['Mathematical Abilities','Reasoning and General Intelligence','English Language and Comprehension','General Awareness','Computer Knowledge and Data Entry Speed Test']],['Post-specific papers',['Statistics for notified statistical posts','General Studies: Finance and Economics for notified audit/accounts posts']]]},
      {id:'banking-exams',name:'Banking Exams',type:'IBPS & SBI',source:'Pattern varies by the current IBPS/SBI notification',official:'https://www.ibps.in/index.php/crp-powt/',sections:[['Prelims',['English Language','Quantitative Aptitude / Numerical Ability','Reasoning Ability']],['Mains',['Reasoning and Computer Aptitude','Data Analysis and Interpretation','English Language','General, Economy and Banking Awareness','Descriptive English where prescribed']],['Final selection',['Interview/group exercise for applicable officer posts; always use the current bank notification']]]},
      {id:'rrb-ntpc',name:'RRB NTPC',type:'Railways',source:'RRB official notifications page',official:'https://www.rrbbbs.gov.in/notifications.php',sections:[['CBT I and CBT II',['Mathematics','General Intelligence and Reasoning','General Awareness']],['Post-specific stages',['Typing Skill Test for applicable clerical posts','Computer Based Aptitude Test for Station Master','Document Verification and Medical Examination']]]}

    const categories = [
      {name:'UPSC Examinations',ids:['upsc-civil-services']},
      {name:'Tamil Nadu Government Examinations',ids:['tnpsc-group-1','tnpsc-group-2-2a','tnpsc-group-4','tnusrb-si','tnusrb-police-constable']},
      {name:'Teaching Examinations',ids:['tntet','pg-trb']},
      {name:'Staff Selection Commission',ids:['ssc-chsl','ssc-cgl']},
      {name:'Railway Examinations',ids:['rrb-je','rrb-ntpc']},
      {name:'Engineering & Medical Entrance Examinations',ids:['jee-main','neet-ug']},
      {name:'Banking Examinations',ids:['banking-exams']}
    ];
    const grid=document.getElementById('examGrid'),detail=document.getElementById('detail');
    categories.forEach(category=>{const section=document.createElement('section');section.className='exam-group';section.innerHTML=`<h2 class="group-title">${category.name}</h2><div class="exam-grid"></div>`;const categoryGrid=section.querySelector('.exam-grid');category.ids.forEach(id=>{const exam=exams.find(item=>item.id===id);if(!exam)return;const b=document.createElement('button');b.className='exam-button';b.type='button';b.dataset.id=exam.id;b.innerHTML=`<strong>${exam.name}</strong><small>${exam.type}</small>`;b.onclick=()=>showExam(exam,b);categoryGrid.appendChild(b)});grid.appendChild(section)});
    const escapeText=text=>text.replace(/[&<>]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[char]));
    async function showExam(exam,button){if(exam.id==='tnpsc-group-4'){document.querySelectorAll('.exam-button').forEach(b=>b.classList.toggle('active',b===button));detail.innerHTML='<div class="detail-top"><div><small>Tamil Nadu</small><h2>TNPSC Group IV Syllabus</h2></div><div class="downloads"><a class="download" href="exam-preparation.html?exam=tnpsc-group-4">Posts, qualifications & preparation →</a></div></div><div id="group4FullReader"></div>';detail.hidden=false;history.replaceState(null,'','#tnpsc-group-4');detail.scrollIntoView({behavior:'smooth',block:'start'});await window.mountGroup4Syllabus(detail.querySelector('#group4FullReader'));return;}document.querySelectorAll('.exam-button').forEach(b=>b.classList.toggle('active',b===button));const links=exam.links||[['Official syllabus / PDF',exam.official]];const fullArea=exam.textFiles?'<h3 class="full-heading">Full Official Syllabus Text</h3><div class="loading" id="fullTextArea">Loading complete syllabus…</div>':'';detail.innerHTML=`<div class="detail-top"><div><small>${exam.type}</small><h2>${exam.name} Syllabus</h2><p class="source">Source: ${exam.source}</p></div><div class="downloads">${links.map(([label,url])=>`<a class="download" href="${url}" target="_blank" rel="noopener">↗ ${label}</a>`).join('')}</div></div>${exam.sections.map(([h,items],index)=>`<details class="section" ${index===0?'open':''}><summary>${h}</summary><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></details>`).join('')}${fullArea}<div class="note"><strong>Important:</strong> Check the latest official notification for marks, eligibility, negative marking and post-specific changes.</div>`;detail.hidden=false;detail.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'',`#${exam.id}`);if(exam.textFiles){const area=document.getElementById('fullTextArea');try{const texts=await Promise.all(exam.textFiles.map(async([label,url])=>[label,await fetch(url).then(response=>{if(!response.ok)throw new Error('Unable to load syllabus text');return response.text()})]));if(area)area.outerHTML=texts.map(([label,text],index)=>`<details class="full-syllabus" ${index===0?'open':''}><summary>${label}</summary><pre class="full-text">${escapeText(text)}</pre></details>`).join('')}catch(error){if(area)area.textContent='The full text could not be loaded. Please use the PDF button above.'}}}
    const selected=exams.find(e=>e.id===location.hash.slice(1));if(selected){const button=document.querySelector(`[data-id="${selected.id}"]`);showExam(selected,button)}
  </script>
