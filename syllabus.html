<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Competitive exam syllabi for TNPSC, TNUSRB, UPSC, SSC, Banking and Railways with downloadable PDFs.">
  <title>Exam Syllabus | ClearExams</title>
  <style>
    :root{--blue:#173b75;--blue2:#255caa;--ink:#172033;--muted:#667085;--line:#dbe4f0;--soft:#f3f7fc;--white:#fff;--green:#087f5b}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--soft);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
    header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:18px 20px;box-shadow:0 5px 20px #173b7533}
    .nav{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-size:1.3rem;font-weight:800;letter-spacing:.04em}.home{color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:999px;padding:8px 14px;font-weight:700}
    main{max-width:1080px;margin:auto;padding:42px 18px 70px}.hero{text-align:center;margin-bottom:30px}.hero h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1;color:var(--blue);margin:0 0 12px}.hero p{max-width:700px;margin:auto;color:var(--muted);font-size:1.05rem}
    .exam-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:28px 0}.exam-button{appearance:none;width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px;text-align:left;cursor:pointer;box-shadow:0 5px 16px #173b7510;transition:.2s}.exam-button:hover,.exam-button:focus-visible{transform:translateY(-2px);border-color:var(--blue2);outline:none}.exam-button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.exam-button small{display:block;color:var(--muted);margin-top:4px}.exam-button.active small{color:#dce8ff}.exam-button strong{font-size:1.05rem}
    .detail{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(20px,5vw,38px);box-shadow:0 12px 30px #173b7512}.detail[hidden]{display:none}.detail-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:20px}.detail h2{color:var(--blue);font-size:clamp(1.6rem,4vw,2.2rem);margin:0}.download{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;text-decoration:none;border-radius:999px;padding:11px 18px;font-weight:800}.download:hover{filter:brightness(.92)}.section{margin-top:22px}.section h3{color:var(--blue);font-size:1.15rem;margin:0 0 8px}.section ul{margin:0;padding-left:22px}.section li{margin:7px 0}.note{margin-top:26px;padding:14px 16px;border-left:4px solid #d99b16;background:#fff8e6;color:#6b4b00;border-radius:8px}
    footer{text-align:center;color:var(--muted);padding:24px 16px;border-top:1px solid var(--line);background:#fff}@media(max-width:540px){main{padding-top:30px}.exam-grid{grid-template-columns:1fr 1fr}.exam-button{padding:14px 12px}.detail-top{display:block}.download{margin-top:15px;width:100%;justify-content:center}}
  </style>
</head>
<body>
  <header><div class="nav"><div class="brand">ClearExams</div><a class="home" href="index.html">Home</a></div></header>
  <main>
    <section class="hero"><h1>Exam Syllabus</h1><p>Select an examination to view its syllabus below. Use the download button to save the syllabus PDF for offline study.</p></section>
    <div class="exam-grid" id="examGrid" aria-label="Choose an examination"></div>
    <section class="detail" id="detail" hidden aria-live="polite"></section>
  </main>
  <footer>© 2026 ClearExams.ink · Your Path to Success</footer>
  <script>
    const exams = [
      {id:'tnpsc-group-1',name:'TNPSC Group I',type:'Tamil Nadu',sections:[['Preliminary Examination',['General Studies - degree standard','Aptitude and Mental Ability - SSLC standard','Tamil eligibility and scoring requirements as prescribed']],['General Studies',['General Science','Geography of India and Tamil Nadu','History and Culture of India and Tamil Nadu','Indian Polity','Indian Economy and Development Administration','Indian National Movement','Tamil Nadu history, culture and socio-political movements','Current Events']],['Main Examination',['Tamil Eligibility Test','General Studies descriptive papers','Interview and personality assessment where applicable']]]},
      {id:'tnpsc-group-2-2a',name:'TNPSC Group II & IIA',type:'Tamil Nadu',sections:[['Preliminary Examination',['General Tamil or General English','General Studies','Aptitude and Mental Ability']],['General Studies',['Science, current events and geography','Indian and Tamil Nadu history and culture','Polity, economy and national movement','Tamil Nadu administration and development']],['Main Examination',['Tamil Eligibility Test','General Studies papers according to the post','Interview applies only where prescribed']]]},
      {id:'tnpsc-group-4',name:'TNPSC Group IV',type:'Tamil Nadu',sections:[['Written Examination',['Tamil Eligibility-cum-Scoring Test','General Studies','Aptitude and Mental Ability']],['Core Subjects',['Science and current events','Geography, history and culture','Indian Polity and Economy','Indian National Movement','Tamil Nadu administration and development','Basic arithmetic and reasoning']]]},
      {id:'tnusrb-si',name:'TNUSRB Sub-Inspector',type:'Police recruitment',sections:[['Written Examination',['Tamil Language Eligibility Test','General Knowledge','Psychology: logical analysis, numerical analysis, communication, information handling and mental ability']],['Departmental Candidates',['Police Standing Orders','Police Administration and notified departmental subjects']],['Selection Stages',['Certificate verification and physical measurement','Endurance and physical-efficiency tests','Viva voce and special marks where prescribed']]]},
      {id:'tnusrb-police-constable',name:'TNUSRB Police Constable',type:'Police recruitment',sections:[['Written Examination',['Tamil Language Eligibility Test','General Knowledge','Psychology']],['General Knowledge',['Science, history and geography','Economics, commerce and Indian Polity','Current Events']],['Selection Stages',['Certificate verification','Physical measurement, endurance and efficiency tests','Special marks where prescribed']]]},
      {id:'upsc-civil-services',name:'UPSC Civil Services',type:'National',sections:[['Preliminary Examination',['General Studies Paper I','General Studies Paper II (CSAT) - qualifying as prescribed']],['Main Examination',['Qualifying Indian Language and English','Essay','General Studies Papers I-IV','Two Optional Subject papers']],['Final Stage',['Personality Test / Interview']]]},
      {id:'ssc-cgl',name:'SSC CGL',type:'National',sections:[['Tier I',['General Intelligence and Reasoning','General Awareness','Quantitative Aptitude','English Comprehension']],['Tier II',['Mathematical Abilities','Reasoning and General Intelligence','English Language and Comprehension','General Awareness','Computer Knowledge and Data Entry Skill Test']],['Post-specific Papers',['Statistics where applicable','Finance and Economics where applicable']]]},
      {id:'banking-exams',name:'Banking Exams',type:'IBPS & SBI',sections:[['Preliminary Examination',['English Language','Numerical Ability or Quantitative Aptitude','Reasoning Ability']],['Main Examination',['Reasoning and Computer Aptitude','Data Analysis and Interpretation','English Language','General, Economy and Banking Awareness','Descriptive English where prescribed']],['Officer Selection',['Interview or group exercise may apply to officer posts']]]},
      {id:'rrb-ntpc',name:'RRB NTPC',type:'Railways',sections:[['Computer Based Tests',['Mathematics','General Intelligence and Reasoning','General Awareness']],['Post-specific Stages',['Typing Skill Test where applicable','Computer Based Aptitude Test where applicable','Document verification and medical examination']]]}
    ];
    const grid=document.getElementById('examGrid'),detail=document.getElementById('detail');
    exams.forEach(exam=>{const b=document.createElement('button');b.className='exam-button';b.type='button';b.dataset.id=exam.id;b.innerHTML=`<strong>${exam.name}</strong><small>${exam.type}</small>`;b.onclick=()=>showExam(exam,b);grid.appendChild(b)});
    function showExam(exam,button){document.querySelectorAll('.exam-button').forEach(b=>b.classList.toggle('active',b===button));detail.innerHTML=`<div class="detail-top"><div><small>${exam.type}</small><h2>${exam.name} Syllabus</h2></div><a class="download" href="syllabus-pdfs/${exam.id}-syllabus.pdf" download>⬇ Download PDF</a></div>${exam.sections.map(([h,items])=>`<div class="section"><h3>${h}</h3><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}<div class="note"><strong>Important:</strong> Always verify marks, eligibility, negative marking and post-specific papers in the latest official notification.</div>`;detail.hidden=false;detail.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'',`#${exam.id}`)}
    const selected=exams.find(e=>e.id===location.hash.slice(1));if(selected){const button=document.querySelector(`[data-id="${selected.id}"]`);showExam(selected,button)}
  </script>
</body>
</html>
